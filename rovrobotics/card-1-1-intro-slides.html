---
title: "Card 1.1 Slides"
permalink: /rovrobotics/card-1-1-intro-slides/
---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card 1.1: Archimedes and Buoyancy -- Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<style>
  :root {
    --accent: #2a7ae2;
    --ink: #1b1f23;
    --paper: #ffffff;
    --muted: #57606a;
    --border: #d0d7de;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #e9edf1;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #root { height: 100%; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .stage-outer {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }

  /* Fixed-size design canvas, scaled to fit via a JS-computed transform --
     lets every slide be authored at generous, fixed pixel sizes ("bigger
     type") without hand-tuning responsive font sizes per breakpoint. */
  .stage {
    width: 1280px;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.18);
    padding: 80px 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 0 0 auto;
  }

  .stage.ar-16-9 { height: 720px; }
  .stage.ar-4-3 { height: 960px; }

  .kicker {
    font-size: 28px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  .slide-title {
    font-size: 64px;
    line-height: 1.1;
    margin: 0 0 40px;
    font-weight: 700;
  }

  .slide-body {
    font-size: 36px;
    line-height: 1.5;
  }

  .slide-body ul {
    margin: 0;
    padding-left: 1.1em;
  }

  .slide-body li {
    margin-bottom: 22px;
  }

  .slide-body li:last-child { margin-bottom: 0; }

  .slide-body a {
    color: var(--accent);
  }

  .slide-wide-image {
    display: block;
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    margin: 10px 0 18px;
  }

  .depth-nav {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 14px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    z-index: 3;
  }

  .depth-nav.depth-up {
    bottom: auto;
    top: 14px;
  }

  .depth-nav:hover {
    background: rgba(0,0,0,0.75);
  }

  .title-slide {
    text-align: left;
    justify-content: center;
  }

  .title-slide .slide-title {
    font-size: 76px;
    margin-bottom: 16px;
  }

  .title-slide .slide-subtitle {
    font-size: 34px;
    color: var(--muted);
  }

  .slide-counter-badge {
    position: absolute;
    bottom: 18px;
    right: 24px;
    font-size: 15px;
    color: var(--muted);
  }

  /* --- Toolbar (not part of the scaled stage, so it stays a readable,
     fixed size regardless of projector distance / zoom level) --- */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #1b1f23;
    color: #fff;
    font-size: 14px;
    flex-wrap: wrap;
  }

  .toolbar button {
    background: #333a42;
    color: #fff;
    border: 1px solid #4a545e;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }

  .toolbar button:hover { background: #444e58; }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }

  .toolbar .spacer { flex: 1 1 auto; }
  .toolbar .counter { min-width: 4.5em; text-align: center; }
  .toolbar a.back-link { color: #9db8e8; text-decoration: none; font-size: 14px; }
  .toolbar a.back-link:hover { text-decoration: underline; }

  /* --- Speaker notes panel: docked below the stage, plain readable text,
     hidden by default so a mirrored/projected display shows a clean deck. --- */
  .notes-panel {
    flex: 0 0 auto;
    background: #f6f8fa;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    max-height: 26vh;
    overflow-y: auto;
    font-size: 17px;
    line-height: 1.5;
  }

  .notes-panel h3 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    cursor: pointer;
  }
  .click-zone.left { left: 0; }
  .click-zone.right { right: 0; }

  /* --- Outline / print-notes view: a plain scrollable page listing every
     slide with its full speaker notes, meant for printing ahead of class. --- */
  .outline {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    overflow-y: auto;
    height: 100%;
  }

  .outline h1 { margin-bottom: 4px; }
  .outline .outline-sub { color: var(--muted); margin-top: 0; }

  .outline-slide {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin: 20px 0;
    break-inside: avoid;
  }

  .outline-slide h2 {
    margin: 0 0 8px;
    font-size: 22px;
  }

  .outline-slide.outline-nested {
    margin: 12px 0 12px 32px;
    background: #f6f8fa;
    border-style: dashed;
  }

  .outline-slide h3 {
    margin: 0 0 6px;
    font-size: 18px;
    color: var(--muted);
  }

  .outline-slide .outline-bullets {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 14px;
  }

  .outline-slide .outline-notes {
    font-size: 16px;
    line-height: 1.5;
  }

  .outline-slide .outline-notes p:first-child { margin-top: 0; }

  @media print {
    .toolbar { display: none !important; }
    .outline { height: auto; overflow: visible; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module">
{% raw %}
const { useState, useEffect, useRef, useCallback } = React;

// Edit this array to change the deck. `bullets` is what students see on the
// slide (keep it short, they're reading fast); `notes` is only ever shown in
// the notes panel or the printable outline, so it can be a full paragraph.
// A bullet can be a plain string, or { text, href } to render as a link.
// A top-level slide can carry a `down` array of extra slides reachable with
// the down arrow / "More" button -- optional detail (a worked example here)
// that the fast path (left/right, space) skips right over.
const SLIDES = [
  {
    kind: "title",
    kicker: "Card 1.1",
    title: "Archimedes and Buoyancy",
    subtitle: "Why some things sink and some things float",
    notes: "Welcome them in. This is the first science card of the year. Keep this fast and build curiosity -- the full explanation lives in the Resource reading, not here."
  },
  {
    kind: "bullets",
    kicker: "Warm-up",
    title: "Same Steel, Opposite Fates",
    bullets: [
      "A steel bolt: sinks.",
      "A steel ship: floats.",
      "Same material. So what's actually different?"
    ],
    notes: "Let them guess before moving on. Most will say something about weight or density in general terms -- that's fine, today's reading makes the actual mechanism precise."
  },
  {
    kind: "bullets",
    kicker: "The big idea",
    title: "The Two-Number Contest",
    bullets: [
      "Weight: pulls the object down.",
      "Buoyant force: the weight of the water it displaces, pushes up.",
      "Whichever number wins decides sink, float, or hover."
    ],
    notes: "This is Archimedes' principle in the card's own words: the water pushes up with a force equal to the weight of the water displaced. Emphasize it's about the WATER's weight, not the object's."
  },
  {
    kind: "wide",
    kicker: "Picture it",
    title: "Why the Hull Wins",
    image: "/assets/img/rovrobotics/fig-ship-bolt.svg",
    bullets: [
      "Bolt: tiny buoyant force, barely displaces anything.",
      "Hull: same steel, hollow, displaces a houseful of water.",
      "Shape decides the contest, not material."
    ],
    notes: "Walk through the arrows: on the bolt, weight badly outweighs buoyant force. On the hull, they're balanced because the hollow shape displaces so much more water. This is the 'displaces' vocabulary they need for the written artifact."
  },
  {
    kind: "wide",
    kicker: "Three states",
    title: "Sink, Hover, or Float",
    image: "/assets/img/rovrobotics/fig-buoyancy-states.svg",
    bullets: [
      "Weight > buoyant force: sinks.",
      "Weight = buoyant force: neutral buoyancy, hovers.",
      "Weight < buoyant force: rises and floats."
    ],
    notes: "Neutral buoyancy is the state this whole unit cares about. A robot that hovers on its own spends its thruster power on the mission instead of fighting its own weight -- that's the ROV payoff, not just a physics fact."
  },
  {
    kind: "bullets",
    kicker: "Today's bench challenge",
    title: "Measure, Calculate, Predict",
    bullets: [
      "Weigh a real part: PVC, a motor, a bolt, whatever's handed out.",
      "Measure its volume by water displacement in the 9-inch bin.",
      "Calculate buoyant force: volume × 1 g per cm³.",
      "Predict sink or float, then test it."
    ],
    notes: "Preview the actual lab. Each team builds one table covering several parts. The point isn't trial and error, it's that the math predicts the result before they ever drop the part in the bin.",
    down: [
      {
        kind: "bullets",
        kicker: "If you want a worked example",
        title: "One Part, Worked Out",
        bullets: [
          "A bolt: weighs 15 g, displaces 2 cm³ of water.",
          "Buoyant force: 2 g.",
          "Net force: 2 − 15 = −13 g.",
          "Prediction: sinks, and fast."
        ],
        notes: "Optional. Use this if the class needs a model before starting their own table, skip it if they're ready to dive in. This is exactly the arithmetic their table needs for every row."
      }
    ]
  },
  {
    kind: "bullets",
    kicker: "Try it yourself first",
    title: "Check Your Intuition Digitally",
    bullets: [
      { text: "Try the buoyancy slider", href: "/rovrobotics/card-1-1-archimedes-and-buoyancy/#buoy-demo" },
      "Notice: the buoyant-force number never changes.",
      "Only the ballast does, because the volume doesn't."
    ],
    notes: "Point them at the interactive demo on the card page before they start predicting. It directly tests the same idea as the written prediction prompt: a rigid sealed float behaves the same at 1 meter as it does at 30."
  },
  {
    kind: "bullets",
    kicker: "Plan",
    title: "Card 1.1 Plan",
    bullets: [
      { text: "Read the Resource section", href: "/rovrobotics/card-1-1-archimedes-and-buoyancy/" },
      { text: "Or fill out the printable Worksheet", href: "/rovrobotics/card-1-1-worksheet/" },
      "Predict first, then measure your parts",
      "Clear the card: share your doc (or worksheet), plus a 90-second oral check"
    ],
    notes: "Set expectations for pacing. Remind them the prediction has to be written BEFORE they touch anything -- that's part of what gets checked."
  },
  {
    kind: "bullets",
    kicker: "Why this matters",
    title: "This Is Ebirah's Whole Trick",
    bullets: [
      "Buoyancy and ballast is a named section of MATE's technical documentation.",
      "Neutral trim is the difference between a robot that flies and one that fights you.",
      "Today's math is the same math the team uses to trim the real float."
    ],
    notes: "Tie back to competition stakes. This card isn't abstract physics, it's the exact calculation behind the float they'll tune all season."
  },
  {
    kind: "title",
    title: "Questions?",
    subtitle: "Let's get started.",
    notes: "Open the floor briefly, then move into the bench challenge."
  }
];

// A bullet is either a plain string, or { text, href } to render as a link.
function renderBullets(bullets) {
  return (
    <ul>
      {bullets.map((b, i) => (
        <li key={i}>{typeof b === "string" ? b : <a href={b.href}>{b.text}</a>}</li>
      ))}
    </ul>
  );
}

function Stage({ slide, aspect }) {
  const arClass = aspect === "4:3" ? "ar-4-3" : "ar-16-9";
  if (slide.kind === "title") {
    return (
      <div className={"stage title-slide " + arClass}>
        {slide.kicker && <p className="kicker">{slide.kicker}</p>}
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
      </div>
    );
  }
  if (slide.kind === "wide") {
    // A wide diagram across the slide, bullets below.
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <img className="slide-wide-image" src={slide.image} alt="" />
        <div className="slide-body">{renderBullets(slide.bullets)}</div>
      </div>
    );
  }
  return (
    <div className={"stage " + arClass}>
      <p className="kicker">{slide.kicker}</p>
      <h1 className="slide-title">{slide.title}</h1>
      <div className="slide-body">{renderBullets(slide.bullets)}</div>
    </div>
  );
}

function ScaledStage({ slide, aspect }) {
  const outerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const designW = 1280;
  const designH = aspect === "4:3" ? 960 : 720;

  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const recompute = () => {
      const rect = el.getBoundingClientRect();
      const s = Math.min((rect.width * 0.94) / designW, (rect.height * 0.94) / designH);
      setScale(s > 0 ? s : 1);
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener("resize", recompute);
    return () => { ro.disconnect(); window.removeEventListener("resize", recompute); };
  }, [designH]);

  return (
    <div className="stage-outer" ref={outerRef}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center" }}>
        <Stage slide={slide} aspect={aspect} />
      </div>
    </div>
  );
}

function bulletsToText(bullets) {
  return bullets.map(b => (typeof b === "string" ? b : b.text)).join(" / ");
}

function OutlineCard({ slide, heading, nested }) {
  return (
    <div className={"outline-slide" + (nested ? " outline-nested" : "")}>
      {nested ? <h3>{heading}</h3> : <h2>{heading}</h2>}
      {slide.bullets && <p className="outline-bullets">On slide: {bulletsToText(slide.bullets)}</p>}
      <div className="outline-notes"><p>{slide.notes}</p></div>
    </div>
  );
}

function Outline() {
  return (
    <div className="outline">
      <h1>Card 1.1: Archimedes and Buoyancy</h1>
      <p className="outline-sub">Speaker notes outline. Print this before class if you'd rather have paper than toggle notes on screen. Indented cards are optional "down arrow" detail, skipped by the normal next/prev flow.</p>
      {SLIDES.map((s, i) => (
        <React.Fragment key={i}>
          <OutlineCard slide={s} heading={`${i + 1}. ${s.title}`} />
          {(s.down || []).map((d, j) => (
            <OutlineCard slide={d} heading={`Extra: ${d.title}`} nested key={j} />
          ))}
        </React.Fragment>
      ))}
    </div>
  );
}

// Deep-linking: ?slide=3 opens on that slide (1-indexed, to match the
// on-screen counter), ?extra=1 additionally drops into that slide's Nth
// "down" slide if it has any, ?outline=1 opens straight into the
// speaker-notes outline.
function initialStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const slideParam = parseInt(params.get("slide"), 10);
  const index = Number.isInteger(slideParam) ? Math.min(Math.max(slideParam - 1, 0), SLIDES.length - 1) : 0;
  const maxExtra = (SLIDES[index].down || []).length;
  const extraParam = parseInt(params.get("extra"), 10);
  const subIndex = Number.isInteger(extraParam) ? Math.min(Math.max(extraParam, 0), maxExtra) : 0;
  const mode = params.get("outline") ? "outline" : "deck";
  return { index, subIndex, mode };
}

function App() {
  const initial = initialStateFromUrl();
  const [index, setIndex] = useState(initial.index);
  const [subIndex, setSubIndex] = useState(initial.subIndex);
  const [showNotes, setShowNotes] = useState(false);
  const [aspect, setAspect] = useState("16:9");
  const [mode, setMode] = useState(initial.mode); // "deck" | "outline"

  const topSlide = SLIDES[index];
  const downSlides = topSlide.down || [];
  const slide = subIndex === 0 ? topSlide : downSlides[subIndex - 1];

  const next = useCallback(() => { setIndex(i => Math.min(i + 1, SLIDES.length - 1)); setSubIndex(0); }, []);
  const prev = useCallback(() => { setIndex(i => Math.max(i - 1, 0)); setSubIndex(0); }, []);
  const goDown = useCallback(() => setSubIndex(s => Math.min(s + 1, downSlides.length)), [downSlides.length]);
  const goUp = useCallback(() => setSubIndex(s => Math.max(s - 1, 0)), []);

  useEffect(() => {
    function onKey(e) {
      if (mode !== "deck") {
        if (e.key === "Escape") setMode("deck");
        return;
      }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); goDown(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); goUp(); }
      else if (e.key === "n" || e.key === "N") setShowNotes(v => !v);
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "o" || e.key === "O") setMode("outline");
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [mode, next, prev, goDown, goUp]);

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  if (mode === "outline") {
    return (
      <div className="app">
        <div className="toolbar">
          <a className="back-link" href="/rovrobotics/card-1-1-archimedes-and-buoyancy/">&larr; Card 1.1</a>
          <div className="spacer"></div>
          <button onClick={() => setMode("deck")}>Back to slides (Esc)</button>
          <button onClick={() => window.print()}>Print</button>
        </div>
        <Outline />
      </div>
    );
  }

  return (
    <div className="app">
      <div className="stage-outer" style={{ position: "relative" }}>
        <ScaledStage slide={slide} aspect={aspect} />
        <div className="click-zone left" onClick={prev} title="Previous slide"></div>
        <div className="click-zone right" onClick={next} title="Next slide"></div>
        {subIndex > 0 && (
          <button className="depth-nav depth-up" onClick={goUp} title="Back to the main flow">&#9650; Back</button>
        )}
        {subIndex < downSlides.length && (
          <button className="depth-nav depth-down" onClick={goDown} title="More about this slide">&#9660; More</button>
        )}
        <div className="slide-counter-badge">
          {index + 1} / {SLIDES.length}
          {subIndex > 0 && <span> &middot; extra {subIndex}/{downSlides.length}</span>}
        </div>
      </div>
      {showNotes && (
        <div className="notes-panel">
          <h3>Speaker notes</h3>
          <p>{slide.notes}</p>
        </div>
      )}
      <div className="toolbar">
        <a className="back-link" href="/rovrobotics/card-1-1-archimedes-and-buoyancy/">&larr; Card 1.1</a>
        <div className="spacer"></div>
        <button onClick={prev} disabled={index === 0}>&larr; Prev</button>
        <span className="counter">{index + 1} / {SLIDES.length}</span>
        <button onClick={next} disabled={index === SLIDES.length - 1}>Next &rarr;</button>
        <button className={showNotes ? "active" : ""} onClick={() => setShowNotes(v => !v)}>Notes (N)</button>
        <button onClick={() => setMode("outline")}>Print notes (O)</button>
        <button onClick={() => setAspect(a => a === "16:9" ? "4:3" : "16:9")}>{aspect}</button>
        <button onClick={toggleFullscreen}>Fullscreen (F)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>
</body>
</html>
