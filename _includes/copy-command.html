<div class="copy-command">
  <pre><code>{{ include.command }}</code></pre>
  <button class="copy-btn" type="button" aria-label="Copy this command to clipboard">
    <svg class="copy-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="8" y="8" width="12" height="12" rx="2" ry="2"></rect>
      <path d="M4 16V5a1 1 0 0 1 1-1h11"></path>
    </svg>
    <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </button>
</div>
