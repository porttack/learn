<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A checkmark in a rounded badge: "meets a standard." Matches the
       checkmark badges scattered across the /standards/ banner image
       (assets/img/standards/standards.png). Bold stroke, 2 colors, no
       fine detail, so it still reads clearly at real favicon sizes,
       16 to 32px, same approach as assets/img/pico/favicon.svg. -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#0969da"/>
  <path d="M9 17 L14 22 L23 11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
