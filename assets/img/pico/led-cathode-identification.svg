<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <!-- Simple, original diagram (not a photo) of a 5mm red LED, front view,
       showing the two ways to find the cathode that survive trimming the
       legs: the flat edge on the flange, and the larger internal lead
       frame visible through the dome. Drawn, not photographed, so there
       is no licensing question about the source. -->
  <rect x="0" y="0" width="480" height="320" fill="#ffffff"/>

  <!-- Main LED, front view -->
  <g>
    <!-- Flange (base), a circle with a flat cut on the left -->
    <circle cx="170" cy="140" r="78" fill="#b71c1c" stroke="#7f0000" stroke-width="2"/>
    <rect x="92" y="55" width="26" height="170" fill="#ffffff"/>
    <!-- re-draw the flat edge itself -->
    <line x1="118" y1="70" x2="118" y2="210" stroke="#7f0000" stroke-width="2"/>

    <!-- Raised dome highlight -->
    <circle cx="178" cy="130" r="52" fill="#e53935"/>
    <ellipse cx="160" cy="108" rx="18" ry="12" fill="#ff8a80" opacity="0.7"/>

    <!-- Leads -->
    <rect x="140" y="214" width="8" height="55" fill="#9e9e9e"/>
    <rect x="200" y="214" width="8" height="85" fill="#9e9e9e"/>
  </g>

  <!-- Zoom circle: looking through the dome at the two lead-frame flags -->
  <g>
    <circle cx="380" cy="90" r="66" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"/>
    <circle cx="380" cy="90" r="66" fill="#e53935" opacity="0.12"/>
    <!-- smaller flag: anode -->
    <path d="M 365 70 L 378 70 L 378 95 L 365 95 Z" fill="#616161"/>
    <!-- larger flag: cathode -->
    <path d="M 388 58 L 408 58 L 408 108 L 388 108 Z" fill="#212121"/>
    <text x="380" y="168" text-anchor="middle" font-size="13" fill="#333">Looking through the dome</text>
  </g>

  <!-- Labels with leader lines -->
  <g font-size="15" fill="#1b1f23">
    <line x1="118" y1="150" x2="45" y2="150" stroke="#333" stroke-width="1.5"/>
    <circle cx="118" cy="150" r="3" fill="#333"/>
    <text x="40" y="112">Flat edge on the case:</text>
    <text x="40" y="132">cathode side</text>

    <line x1="204" y1="240" x2="300" y2="240" stroke="#333" stroke-width="1.5"/>
    <circle cx="204" cy="240" r="3" fill="#333"/>
    <text x="305" y="236">Longer leg:</text>
    <text x="305" y="256">anode</text>

    <line x1="144" y1="225" x2="40" y2="260" stroke="#333" stroke-width="1.5"/>
    <circle cx="144" cy="225" r="3" fill="#333"/>
    <text x="40" y="280">Shorter leg:</text>
    <text x="40" y="300">cathode</text>

    <line x1="408" y1="83" x2="440" y2="40" stroke="#333" stroke-width="1.5"/>
    <text x="300" y="30" font-size="13">Bigger flag inside = cathode</text>
  </g>
</svg>
