<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <!-- Simple, original diagram (not a photo) of the "same steel, opposite
       fates" comparison: a small steel bolt that sinks next to a hollow
       steel hull that floats, both the same material, with weight and
       buoyant-force arrows sized to show why they end up on opposite sides
       of the same contest. Drawn, not photographed, so there is no
       licensing question about the source. -->
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1b1f23"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0d47a1"/>
    </marker>
  </defs>

  <!-- Water -->
  <rect x="0" y="170" width="640" height="170" fill="#bfe3f0"/>
  <path d="M 0 170 Q 20 164 40 170 T 80 170 T 120 170 T 160 170 T 200 170 T 240 170 T 280 170 T 320 170 T 360 170 T 400 170 T 440 170 T 480 170 T 520 170 T 560 170 T 600 170 T 640 170"
        fill="none" stroke="#7fb8cf" stroke-width="2"/>

  <!-- Left: steel bolt, resting on the bottom -->
  <g>
    <text x="130" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1f23">Steel bolt</text>
    <rect x="110" y="275" width="40" height="40" rx="4" fill="#616161" stroke="#333" stroke-width="2"/>
    <polygon points="110,275 150,275 142,260 118,260" fill="#757575" stroke="#333" stroke-width="2"/>

    <!-- weight arrow: long, down -->
    <line x1="90" y1="230" x2="90" y2="285" stroke="#1b1f23" stroke-width="3" marker-end="url(#arrow-down)"/>
    <text x="40" y="225" font-size="13" fill="#1b1f23">weight</text>
    <text x="24" y="241" font-size="13" fill="#1b1f23">(heavy for its size)</text>

    <!-- buoyant force arrow: short, up -->
    <line x1="170" y1="295" x2="170" y2="268" stroke="#0d47a1" stroke-width="3" marker-end="url(#arrow-up)"/>
    <text x="178" y="285" font-size="13" fill="#0d47a1">buoyant force</text>
    <text x="178" y="301" font-size="13" fill="#0d47a1">(tiny: displaces</text>
    <text x="178" y="317" font-size="13" fill="#0d47a1">almost no water)</text>
  </g>

  <!-- Divider -->
  <line x1="300" y1="10" x2="300" y2="330" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Right: hollow steel hull, floating -->
  <g>
    <text x="470" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1f23">Steel hull (same steel, hollow)</text>
    <path d="M 370 160 L 530 160 L 515 210 L 385 210 Z" fill="#9e9e9e" stroke="#333" stroke-width="2"/>
    <rect x="380" y="140" width="140" height="22" fill="#bdbdbd" stroke="#333" stroke-width="2"/>

    <!-- weight arrow: moderate, down -->
    <line x1="360" y1="105" x2="360" y2="155" stroke="#1b1f23" stroke-width="3" marker-end="url(#arrow-down)"/>
    <text x="320" y="100" font-size="13" fill="#1b1f23">weight</text>

    <!-- buoyant force arrow: large, up, matching weight -->
    <line x1="540" y1="215" x2="540" y2="165" stroke="#0d47a1" stroke-width="3" marker-end="url(#arrow-up)"/>
    <text x="400" y="235" font-size="13" fill="#0d47a1">buoyant force (huge:</text>
    <text x="400" y="251" font-size="13" fill="#0d47a1">displaces a houseful of water)</text>
  </g>

  <text x="300" y="335" text-anchor="middle" font-size="13" fill="#5f6368">Same material, decided by displaced volume</text>
</svg>
