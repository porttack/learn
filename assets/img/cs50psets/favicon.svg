<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matches the dark crimson of the pathway's banner image -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#800B1A"/>
      <stop offset="100%" stop-color="#4A000A"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"/>

  <!-- Text Group -->
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" text-anchor="middle">
    <!-- Top Row: CS -->
    <text x="256" y="230" font-size="210" letter-spacing="4">CS</text>

    <!-- Bottom Row: 50 -->
    <text x="256" y="425" font-size="210" letter-spacing="2">50</text>
  </g>
</svg>
