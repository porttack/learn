part1:
  - q: "What subject does Dr. Cameron teach at Carl Hayden?"
    options: ["Computer Science", "Math", "Science", "Engineering"]
    answer: ""
  - q: "What city does the underwater robotics competition take place in?"
    options: ["Phoenix, Arizona", "Santa Barbara, California", "San Diego, California", "Miami, Florida"]
    answer: B
  - q: "Which team member has the most technical experience at the beginning?"
    options: ["Oscar", "Luis", "Lorenzo", "Cristian"]
    answer: ""
  - q: "What everyday material do they use to make their robot waterproof?"
    options: ["Duct tape", "Tampons", "Plastic bags", "Aluminum foil"]
    answer: B
  - q: "What advantage does their robot have over the expensive MIT robot?"
    options: ["It's faster underwater", "It can go deeper", "It's more maneuverable in tight spaces", "It has better cameras"]
    answer: ""
part2_title: "Think Like a Computer Scientist"
part2:
  - label: "Working with Constraints"
    text: "The Carl Hayden team had an $800 budget while MIT had $11,000. Describe two creative solutions the team used to build their robot cheaply. How did their \"disadvantages\" sometimes work in their favor?"
    lines: 5
  - label: "Problem Solving"
    text: "Choose ONE technical challenge the team faces in building their robot. Describe the problem and explain step by step how they solve it (like writing an algorithm)."
    fields:
      - { label: "Problem:" }
      - { label: "Steps to solve it:", lines: 4 }
  - label: "Skills and Roles"
    text: "Each team member brought different strengths: technical skills, leadership, creativity, determination. In real computer science and engineering projects, why is it important to have people with different skills working together?"
    lines: 4
  - label: "Your Turn"
    text: "If you had to build a robot to solve a problem at our school (like cleaning, helping in the library, etc.), what would you design? What challenges would you face with a limited budget?"
    lines: 4
  - label: "Personal Connection"
    text: "Which Carl Hayden student in the movie do you think you are most like and why? Consider their personality, strengths, and role on the team."
    lines: 4
before: |
  About 15 to 20 minutes, in the order below. Cut the last one or two if the block is tight. Nothing here gives away the ending. The film is about a team that is counted out, so the warm-ups ask about being counted out, working with almost nothing, and what a team is made of. This is also our own program in miniature: the competition in the film is the MATE ROV event we enter.

  - **Quick vote, hands up (2 minutes):** Who has ever been told they probably could not do something? Who did it anyway? Take two or three volunteers for "what was it, and what happened?" Nobody has to share. Sets up the whole film.
  - **Budget game (4 minutes):** Write two numbers on the board: **$800** and **$11,000**. Tell them one is a team of four high school students and one is a team from a top engineering university, both building the same underwater robot. Ask: which is which, and who do you think wins? Then ask: with $800, what would you build yourself and what would you scavenge or fix? Take guesses on the board. Come back at question 1 of the back page ("Working with Constraints").
  - **Build it from junk (4 minutes, pairs):** "Your robot has to work underwater and you have almost no money. Name three everyday things you could use to build a part of it (a frame, something to keep water out, something to push it along)." Each pair shares one. Students will guess some of the film's answers, and that is fine. They enjoy catching it on screen.
  - **Who is on a team? (3 minutes):** Put four words on the board: **builder, planner, encourager, problem solver**. Ask students to silently pick the one that sounds most like them, then stand by that word (or raise fingers 1 to 4). Ask one person at each word: "What would the team miss if you were not on it?" Sets up "Skills and Roles" on the back page.
  - **Wheel of Names (3 minutes):** paste in the class list and spin. "Name something you made, fixed, or built that you are proud of, even if it was ugly." Spin for three or four students.
  - **Predict from what you know (2 minutes):** The film is based on a true story and the team in it is from a public high school in Phoenix. Ask: what could go wrong for a team with no money, no experience, and a lot of people expecting them to fail? Write guesses on the board and check them at the end of the film.

  A note on the content: the students in the film are undocumented, and the film is rated PG-13 for the themes that come with that. Do not ask anyone in the room about their own or their family's status. Keep the questions about the film and about what the team does. If a student brings it up, listen and thank them; do not press for more.
