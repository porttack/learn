part1:
  - q: "Where does the team go for preseason training camp?"
    options: ["A military base in Virginia", "Gettysburg College in Pennsylvania", "A lake camp in Maryland", "The school gym"]
    answer: B
  - q: "Who is named head coach of the team at the start of the film?"
    options: ["Bill Yoast", "Herman Boone", "Gerry Bertier", "Coach Petrino"]
    answer: B
  - q: "How does Coach Boone first try to get the players to know each other at camp?"
    options: ["He assigns roommates of a different race", "He lets them choose their own groups", "He makes them wear name tags", "He cancels practice for a week"]
    answer: ""
  - q: "What do Gerry Bertier and Julius Campbell have to do before the team can really work together?"
    options: ["Win a vote for captain", "Settle their differences and trust each other", "Switch positions", "Switch schools"]
    answer: ""
  - q: "What happens to Gerry Bertier late in the film?"
    options: ["He quits the team", "He is badly hurt in a car accident", "He moves away", "He is made head coach"]
    answer: ""
part2_title: "Social-Emotional Learning"
part2:
  - label: "Social Awareness"
    text: "At camp the players are put with teammates they did not choose and do not trust. Describe one moment when a player or coach saw something from another person's point of view. What did they notice that they had missed before?"
    lines: 5
  - label: "Self-Management"
    text: "Pick one character who has to control a strong feeling, like anger or pride, to do the right thing. What did they do, and why did it matter?"
    lines: 4
  - label: "Relationship Skills"
    text: "Teams are built from many small moments. Pick one scene where a friendship or trust grew. What did each person do to make that happen?"
    lines: 4
  - label: "Responsible Decision-Making"
    text: "Several characters have to choose between going along with the crowd and doing what they think is right. Pick one decision. What made it hard, and what did it cost or earn them?"
    lines: 4
  - label: "Personal Connection"
    text: "Which character in the movie do you think you are most like and why? Think about Coach Boone, Coach Yoast, Gerry, Julius, Sunshine or another player."
    lines: 4
before: |
  About 10 to 15 minutes. The film is about people who are put together without choosing it, so the warm-ups ask about teams and groups. Nothing here gives away the story.

  - **Quick vote, hands up (2 minutes):** Who has ever been put on a team or in a group with people they did not pick? Take two or three volunteers for "how did it go?"
  - **What makes a team? (4 minutes, pairs):** Each pair lists three things a good team needs besides skill. Share and write the common ones on the board. Come back to the list at the end of the film.
  - **Set the scene (3 minutes):** Tell them the film is based on a true story from 1971, when a Virginia high school had to combine its Black and white students for the first time. Ask: what might make that hard, and what could a leader do?
  - **Content note (1 minute):** The film shows racism, including slurs and threats, and a serious car accident. It is rated PG. Remind students the film shows these things to show why they were wrong.
