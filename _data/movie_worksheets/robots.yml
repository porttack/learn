part1:
  - q: "Why does Rodney leave Rivet Town and travel to Robot City?"
    options: ["His family is moving there for his dad's new job", "To show his invention to Bigweld and get a job at Bigweld Industries", "To compete in a robot race", "To buy spare parts for his dad"]
    answer: B
  - q: "What does Rodney invent at the start of the movie?"
    options: ["A flying car", "The Wonderbot, a little robot that helps wash dishes", "A robot dog", "A rocket ship"]
    answer: B
  - q: "What does Ratchet stop making so that older robots are forced to buy expensive upgrades?"
    options: ["Oil", "Spare parts", "Batteries", "Paint"]
    answer: B
  - q: "Rodney's dad, Herb, works hard washing dishes at a job he doesn't love, but he still encourages Rodney to leave home and chase his dream. Why does Herb do this?"
    options: ["He wants Rodney to send money home", "He is tired of Rodney's inventions breaking things", "He gave up on his own dream and doesn't want Rodney to live with that same regret", "Rodney's mom told him to"]
    answer: C
  - q: "Ratchet's slogan is \"Why be you when you can be new?\" What is this message really trying to make robots believe?"
    options: ["That everyone deserves to be treated fairly", "That they are only good enough if they buy the newest upgrades", "That old robots are the smartest robots", "That robots should repair each other for free"]
    answer: B
part2_title: "Think About Character"
part2:
  - label: "Not Giving Up"
    text: "Rodney gets turned away many times. Pick one time he could have quit. What did he do instead?"
    lines: 2
  - label: "Who Gets Left Behind"
    text: "Ratchet calls old robots \"outmodes\" and says they are worthless. How does the movie show they still matter? Have you seen an ad that tried to make you want something new?"
    lines: 2
  - label: "See a Need, Fill a Need"
    text: "Rodney fixes broken robots, even when they can't pay. Name one need at our school or in our town. How could a kid your age help?"
    lines: 2
  - label: "Fender's Budget"
    text: "Fender earns 100 bolts a week. Mark each item Need or Want."
    table:
      head: ["Item", "Cost (bolts)", "Need or Want?"]
      cells:
        - ["Oil and fuel", "25", ""]
        - ["Rent", "30", ""]
        - ["Spare part for his arm", "20", ""]
        - ["Shiny chrome upgrade", "60", ""]
        - ["Movie night with friends", "10", ""]
    fields:
      - { label: "a) Add up the needs. How much is left?" }
      - { label: "b) Can Fender buy the upgrade this week? How could he save up for it?", lines: 2 }
  - label: "Personal Connection"
    text: "Which character are you most like? Why? (Rodney, Fender, Piper, Cappy, Bigweld, Herb, Aunt Fanny, or another character)"
    lines: 2
teacher: |
  Questions 1 to 3 are plot comprehension. Questions 4 and 5 ask students to read motive and message rather than recall plot.

  CASEL focus by question:

  - 4: Social Awareness (reading a parent's motives and sacrifice)
  - 5: Responsible Decision-Making (recognizing manipulative messaging)
  - 6: Self-Management (perseverance through rejection)
  - 7: Social Awareness (valuing people others dismiss; media literacy)
  - 8: Responsible Decision-Making and Relationship Skills (service to community)
  - 9: Responsible Decision-Making and financial literacy (needs vs. wants, budgeting, saving). Key: needs = oil 25 + rent 30 + spare part 20 = 75 bolts, leaving 25. The upgrade (60) does not fit this week. Strong answers save the extra: skipping movie night saves 25 a week, so about 3 weeks; keeping movie night saves 15 a week, so 4 weeks. Movie night is a want, but a reasonable one; accept either choice if the math is right.
  - 10: Self-Awareness (self-reflection and identity)

  Content note: Rated PG for brief language and some rude humor, mostly slapstick and bodily-noise jokes. Fine for grades 6 to 9.
before: |
  Short warm-ups for the start of the block (each takes 2 to 5 minutes, and they matter most when the film is shorter than the period). All of them tie to the film's themes of wanting new things, being worth something, and noticing needs.

  - **[Wheel of Names](https://wheelofnames.com/) (the one used in class):** paste in the class list and spin to pick who answers. "What's something you really wanted, got, and then realized wasn't worth it?" Spin for several students. It sets up Ratchet's upgrades and the needs vs. wants question on the back.
  - **Show of hands:** quick questions, hands up, no explanations needed. Then pick a few hands to say more.
    - Who has ever bought something because an ad or a friend made it look cool?
    - Who has ever bought something and regretted it?
    - Who has a phone or game that suddenly needed an upgrade or got slow?
  - **Slogan check:** put "Why be you when you can be new?" on the board with no context. Ask where students have seen a message like it (ads, social media, shoe and phone releases). Revisit it at question 5.
  - **New or needed? (four corners):** Would you rather be the newest model or the one everyone depends on? Corners: newest, needed, both, neither. One student per corner explains.
  - **One minute quick-write:** "Name something that is old or broken and still worth keeping or fixing." Share two or three. This sets up Fender and the Rusties.
  - **See a need:** pairs have 90 seconds to name one thing at school that bothers people and an invention that could fix it. Come back to it after the film at question 8.
  - **Predict from the title:** what would a city made only of robots be like, and who might get left out? Write guesses on the board and check them at the end.
