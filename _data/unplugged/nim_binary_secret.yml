# Fixed worked examples and practice positions for
# _unplugged/nim-binary-secret.md. Every field here (binary strings, the
# nim-sum, the answer, the move) is recomputed independently by
# tools/check_nim.mjs from just the `piles` list, using both the nim-sum
# shortcut and a brute-force game-tree search, so a typo here gets caught
# rather than silently taught to students.
#
# "answer: win" means the player about to move can force a win. Pile labels
# in the move text (A, B, C, ...) match the order piles are listed in.

worked_examples:
  - piles: [3, 5, 7]
    intro: >-
      Three piles, no repeats. A good first example because none of the
      piles happen to match.
    width: 3
    binary: ["011", "101", "111"]
    sum: 1
    sum_binary: "001"
    answer: win
    move: "Take 1 from pile A (3 down to 2)."

  - piles: [1, 4, 5, 6]
    intro: >-
      Four piles this time. The steps are exactly the same, just one more
      row in the table.
    width: 3
    binary: ["001", "100", "101", "110"]
    sum: 6
    sum_binary: "110"
    answer: win
    move: "Take 2 from pile B (4 down to 2)."

  - piles: [2, 4, 6]
    intro: >-
      Not every position has a winning move. Here's one that doesn't, so
      you can see what a losing position looks like from the inside.
    width: 3
    binary: ["010", "100", "110"]
    sum: 0
    sum_binary: "000"
    answer: lose
    move: "No winning move: any move you make leaves your opponent a winning position."

practice:
  - piles: [4, 7, 10]
    width: 4
    binary: ["0100", "0111", "1010"]
    sum: 9
    sum_binary: "1001"
    answer: win
    move: "Take 7 from pile C (10 down to 3)."

  - piles: [5, 7, 9, 11]
    width: 4
    binary: ["0101", "0111", "1001", "1011"]
    sum: 0
    sum_binary: "0000"
    answer: lose
    move: "No winning move: any move you make leaves your opponent a winning position."

  - piles: [3, 4, 5]
    width: 3
    binary: ["011", "100", "101"]
    sum: 2
    sum_binary: "010"
    answer: win
    move: "Take 2 from pile A (3 down to 1)."

  - piles: [1, 4, 5]
    width: 3
    binary: ["001", "100", "101"]
    sum: 0
    sum_binary: "000"
    answer: lose
    move: "No winning move: any move you make leaves your opponent a winning position."

  - piles: [2, 5, 8, 12]
    width: 4
    binary: ["0010", "0101", "1000", "1100"]
    sum: 3
    sum_binary: "0011"
    answer: win
    move: "Take 1 from pile A (2 down to 1)."

  - piles: [7, 9, 14]
    width: 4
    binary: ["0111", "1001", "1110"]
    sum: 0
    sum_binary: "0000"
    answer: lose
    move: "No winning move: any move you make leaves your opponent a winning position."

  - piles: [8, 9, 10]
    width: 4
    binary: ["1000", "1001", "1010"]
    sum: 11
    sum_binary: "1011"
    answer: win
    move: "Take 5 from pile A (8 down to 3)."

  - piles: [1, 2, 3]
    width: 3
    binary: ["001", "010", "011"]
    sum: 0
    sum_binary: "000"
    answer: lose
    move: "No winning move: any move you make leaves your opponent a winning position."
