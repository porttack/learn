# Data for _unplugged/creature-sorting-2.md, the short HS follow-up page
# that connects the same trait expressions to real Python `if` statements.
# Written in Python style (lowercase and/or/not) on purpose -- the parser in
# assets/js/unplugged/creatures.js reads AND/OR/NOT case-insensitively, so
# the same evaluator checks both this and the main worksheet.
title: "Creature sorting: real if statements"
partA:
  - kind: evaluate
    expr: "striped and not round"
    answer: [2, 4, 6, 8]
  - kind: evaluate
    expr: "two_eyes or has_hat"
    answer: [3, 4, 5, 6, 7, 8, 11, 12, 13, 14, 15, 16]
  - kind: evaluate
    expr: "not (striped or has_hat)"
    answer: [1, 3, 9, 11]
partB:
  - kind: reverse
    marked: [9, 10, 13, 14]
    key: "not two_eyes and round"
