# same five messages and the same "crack it" puzzle print every time this
# page is printed. tools/check_caesar_cipher.mjs verifies every cipher
# string here really does decrypt back to its plain string under the given
# key, and that the "crack it" ciphertext is unambiguous (only one of the 25
# possible shifts turns it back into a real phrase).

