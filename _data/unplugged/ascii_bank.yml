# Bank for the ASCII messages generator (_unplugged/ascii-messages-generator.md).
#
# `jokes` are for the "decode" direction: `setup` prints in plain text, and
# `punchline` gets encoded in whichever format the student picked. `words`
# are for the "encode" direction: a short word printed in plain text that the
# student writes the codes for.
#
# Every punchline and word must be capital letters and spaces only (checked
# by tools/check_ascii_messages.mjs, which also round-trips each one through
# encode/decode in all three formats). No em dashes or en dashes.
jokes:
  - setup: "Why did the computer go to the doctor?"
    punchline: "IT HAD A VIRUS"
  - setup: "Why do programmers like dark mode?"
    punchline: "LIGHT ATTRACTS BUGS"
  - setup: "Why was the robot always so calm?"
    punchline: "NOTHING EVER BUGGED IT"
  - setup: "What did the motherboard say to the memory chip?"
    punchline: "I NEED MORE SPACE"
  - setup: "Why did the robot go on a diet?"
    punchline: "TOO MANY BYTES"
  - setup: "Why don't robots ever panic?"
    punchline: "THEY STAY LOGICAL"
  - setup: "Why did the sensor break up with the switch?"
    punchline: "THERE WAS NO CONNECTION"
  - setup: "What is a computer's favorite snack?"
    punchline: "MICROCHIPS"
  - setup: "Why did the loop keep going and going?"
    punchline: "IT FORGOT TO STOP"
  - setup: "What did one wire say to the other?"
    punchline: "YOU ARE GROUNDING ME"
  - setup: "Why did the underwater robot bring a flashlight?"
    punchline: "TO SEE UNDERWATER"
  - setup: "Why was six afraid of seven?"
    punchline: "BECAUSE SEVEN EIGHT NINE"
  - setup: "What kind of tree does a programmer climb?"
    punchline: "A BINARY TREE"
  - setup: "Why did the function feel lonely?"
    punchline: "IT HAD NO CALLERS"
  - setup: "Why do keyboards never get tired?"
    punchline: "THEY ALWAYS HAVE SPACE BARS"
  - setup: "Why did the developer run out of money?"
    punchline: "HE USED UP ALL HIS CACHE"
  - setup: "What did the algorithm say to the puzzle?"
    punchline: "I WILL SOLVE YOU"
  - setup: "Why do robots make good friends?"
    punchline: "THEY ALWAYS FOLLOW THROUGH"
  - setup: "What is a robot's favorite kind of music?"
    punchline: "HEAVY METAL"
  - setup: "Why did the circuit feel useless?"
    punchline: "IT WAS NOT CONNECTED"
  - setup: "Why did the string feel unfinished?"
    punchline: "IT HAD LOOSE ENDS"
  - setup: "What do you call eight bits in a row?"
    punchline: "A BYTE"
  - setup: "Riddle: I have keys but open no locks. What am I?"
    punchline: "A KEYBOARD"
  - setup: "Riddle: I have a screen but I am not a window. What am I?"
    punchline: "A MONITOR"
  - setup: "Riddle: I store your files but I am not a cabinet. What am I?"
    punchline: "A HARD DRIVE"
  - setup: "Riddle: I click but I am not a clock. What am I?"
    punchline: "A MOUSE"
  - setup: "Riddle: I connect two things but I have no hands. What am I?"
    punchline: "A CABLE"
  - setup: "Fact: the first computer bug was a real insect."
    punchline: "A MOTH IN A RELAY"
  - setup: "Fact: binary only uses two digits."
    punchline: "ZERO AND ONE"
  - setup: "Fact: a byte is a group of bits."
    punchline: "EIGHT BITS MAKE A BYTE"
  - setup: "Fact: ASCII gives every letter its own number."
    punchline: "COMPUTERS ONLY SEE NUMBERS"
  - setup: "Fact: underwater robots cannot use radio well."
    punchline: "WATER BLOCKS THE SIGNAL"
  - setup: "Fact: the word robot comes from an old Czech word."
    punchline: "IT MEANS FORCED LABOR"
  - setup: "Why did the programmer feel cheated at review time?"
    punchline: "HE DID NOT GET ARRAYS"
  - setup: "Why did the computer feel a draft?"
    punchline: "IT LEFT A WINDOW OPEN"
  - setup: "What do you call a robot that tells jokes?"
    punchline: "A COMEDIAN BOT"
  - setup: "What did the printer say to the paper?"
    punchline: "YOU ARE MY TYPE"
  - setup: "Why did the battery feel great?"
    punchline: "IT WAS FULLY CHARGED"
  - setup: "What do you call a robot on a break?"
    punchline: "OFF DUTY"
  - setup: "Why did the sensor fail the test?"
    punchline: "IT MISREAD THE DATA"
  - setup: "What do you call a shape drawn by code?"
    punchline: "A POLYGON"
  - setup: "Fact: a tether protects the cable that connects an ROV to the surface."
    punchline: "THE TETHER PROTECTS THE WIRES"
  - setup: "Why did the two binary digits get married?"
    punchline: "THEY MADE A GREAT BIT"
  - setup: "What do you call a computer that never crashes?"
    punchline: "A DREAM MACHINE"
  - setup: "Why did the code review take so long?"
    punchline: "EVERY LINE NEEDED A LOOK"
  - setup: "What do you call the smallest piece of computer memory?"
    punchline: "A BIT"

words:
  - "ROBOT"
  - "SENSOR"
  - "MOTOR"
  - "PIXEL"
  - "LOOP"
  - "ARRAY"
  - "CLASS"
  - "LOGIC"
  - "LEVER"
  - "LIGHT"
  - "INPUT"
  - "OUTPUT"
  - "SIGNAL"
  - "CIRCUIT"
  - "BATTERY"
  - "CAMERA"
  - "TETHER"
  - "THRUSTER"
