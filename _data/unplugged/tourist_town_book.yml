# The Ice Cream Vans street map from the CS Unplugged book (2015, p. 149),
# transcribed so tools/check_graphs.mjs can prove the "Ice Cream Vans
# Solution" key's claim: six vans are enough, and no smaller number works.
# Corners are lettered A-Z in no particular order (the book's drawing has
# no letters); the count (26) matches the book's own text, which says
# "with the 26 street corners in Tourist Town...".
