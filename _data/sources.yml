# Source material manifest. Committed; the files themselves are not.
#
# Every lesson's `source:` front matter field must match an `id` here, or be
# `original`. The provenance footer renders from this file.
#
# `use:` is the governing field:
#   adapt     Openly licensed. May be adapted and republished on this site.
#   reference Read to inform lessons. NEVER reproduce, quote at length, or
#             republish. Cite and link instead.
#   original  Written for this site.

- id: original
  use: original
  title: "Original course material"
  author: "Eric Brown"
  licence: "CC BY-NC-SA 4.0"

- id: rpi-pico-2e
  use: adapt
  title: "Get Started with MicroPython on Raspberry Pi Pico, 2nd Edition"
  author: "Gareth Halfacree and Ben Everard"
  publisher: "Raspberry Pi Ltd."
  year: 2024
  isbn: "978-1-912047-29-1"
  licence: "CC BY-NC-SA 3.0 Unported"
  licence_url: "https://creativecommons.org/licenses/by-nc-sa/3.0/"
  dir: source/rpi-pico-2e/
  notes: >-
    "Except where otherwise noted." Photographs by Brian O'Halloran and
    illustrations by Sam Alder may be separately licensed. Flag image reuse
    for review. ShareAlike keeps derivatives at 3.0; not compatible with 4.0.

- id: cs50-ap
  use: adapt
  title: "CS50 AP"
  author: "David J. Malan and the CS50 team, Harvard University"
  licence: "CC BY-NC-SA 4.0"
  licence_url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
  notes: >-
    Problem statements adapted from cs50.harvard.edu/ap. Same approach as
    the cs50-python source: the cs50 library is never required, though it's
    available in cs50.dev if a lesson mentions it. style50, check50, and
    submit50 are still used, since students already work in cs50.dev. Each
    lesson links back to the original problem.

