- id: cs-unplugged-2015
  use: adapt
  link_label: "original activity"
  title: "CS Unplugged"
  author: "Tim Bell, Ian H. Witten and Mike Fellows; adapted for classroom use by Robyn Adams and Jane McKenzie"
  publisher: "csunplugged.org"
  year: 2015
  licence: "CC BY-NC-SA 3.0"
  licence_url: "https://creativecommons.org/licenses/by-nc-sa/3.0/"
  dir: tmp/CSUnplugged_2015_v3.1.pdf
  notes: >-
    2015 revision by Sam Jarman. The book says only "CC BY-NC-SA 3.0," so
    treat it like rpi-pico-2e: derivatives stay at 3.0, not 4.0.
    Illustrations are by Matt Powell; don't reuse them. Redraw figures
    (the dot cards are plain HTML). The book is written as teacher scripts,
    so adaptations here rewrite the activity for a student working alone.

- id: cs-unplugged-web
  use: adapt
  link_label: "original activity"
  title: "CS Unplugged"
  author: "Tim Bell and the CS Unplugged team, University of Canterbury"
  publisher: "csunplugged.org"
  licence: "CC BY-SA 4.0"
  licence_url: "https://creativecommons.org/licenses/by-sa/4.0/"
  notes: >-
    The csunplugged.org WEBSITE (not the 2015 book, which is cs-unplugged-2015
    and NC). No NonCommercial term, but ShareAlike means a page adapted from
    it stays CC BY-SA 4.0; keep each such page entirely adapted from it.
    Link each page to its original unit with source_url.

- id: teaching-london-computing
  use: adapt
  link_label: "original activity"
  title: "Teaching London Computing: Inspiring Unplugged Classroom Activities"
  author: "Paul Curzon, Queen Mary University of London"
  publisher: "teachinglondoncomputing.org"
  licence: "CC BY-NC-SA"
  licence_url: "https://teachinglondoncomputing.org/re-using-our-material/"
  notes: >-
    Their reuse page asks for credit to Prof Paul Curzon, Queen Mary
    University of London, and a link back to teachinglondoncomputing.org.
    No licence version is stated; treat derivatives as CC BY-NC-SA and link
    each adapted page to its original with `source_url:` (the provenance
    footer renders it). Most of their activities are teacher-led (magic
    tricks, whole-class acting); only print-and-use ones get adapted here.

- id: mate-rov-manuals
  use: reference
  title: "MATE ROV Competition Manuals"
  author: "MATE Inspiration for Innovation"
  licence: "Assume all rights reserved unless the document states otherwise"
  dir: source/mate-rov-manuals/
  notes: >-
    Free to download is not free to republish. Read it to align lessons with
    mission tasks, scoring, and safety requirements. Never reproduce rubric
    tables, mission descriptions, or specification text. Paraphrase, cite the
    section, and link to the official manual. Verify the copyright page.