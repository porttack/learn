- id: turtlelab
  title: "TurtleLab"
  url: /turtlelab/
  # The banner lives inside turtlelab/ because it shows Sugar-derived artwork
  # (the blocks and the turtle), which must stay in the AGPL part of the repo.
  banner: /turtlelab/images/banner.png
  banner_alt: "TurtleLab: code blocks beside a spiral the turtle drew"
  blurb: >-
    Snap blocks together and watch a turtle draw: squares, spirals, flowers,
    anything you can plan. A block-based drawing tool with variables, loops
    and math. It runs entirely in your browser, with nothing to install and
    nothing sent anywhere.

- id: turtlelessons
  banner: /assets/img/turtlelessons/banner.png
  banner_alt: "TurtleLab Lessons: four steps rising like stairs, topped with a star"
  title: "TurtleLab Lessons"
  collection: turtlelessons
  url: /turtle-lessons/
  item_label: "Step"
  standards_carrier: turtlelessons
  standards_locator: slug
  blurb: >-
    Eighteen steps with TurtleLab, each starting from a demo you change and
    take further: draw your initials, repeat yourself with loops, let chance
    draw with random, choose a path with if and else, then a first capstone.
    Then keep numbers in variables, count with them, teach the turtle new words,
    put loops inside loops, see color as three numbers, find bugs, and finish
    with a second capstone. Then ask the person using your program for a
    number, listen for clicks on the paper, and finish with a third capstone.
    Then build a click game that uses and, or and not. Then steer a snake with
    the keyboard, moved by a timer. Last, make a game of your own.

- id: python3d-studio
  banner: /assets/img/python3d/studio-banner.png
  banner_alt: "Python in 3D Studio: a blue 3D cube with a hole, next to a few lines of code"
  title: "Python in 3D Studio"
  url: /python3d/studio/
  blurb: >-
    The tool the lessons use, open on its own: type Python, see the 3D model
    appear, spin it around, and export it for printing. Start here if you
    already know what you want to build.

- id: python3d
  banner: /assets/img/python3d/lessons-banner.png
  banner_alt: "Python in 3D Lessons: a flat square becomes a solid cube, then a cube with a hole"
  title: "Python in 3D Lessons"
  url: /python3d/
  blurb: >-
    A short series of lessons: write Python and watch it become an actual 3D
    model you can spin around and print. Same idea as the 2D shapes you
    already know, one more axis: boxes, cylinders, extruded text, booleans,
    holes.

- id: pico
  banner: /assets/img/pico/banner.png
  banner_alt: "MicroPython on Pi Pico and Projects: a Raspberry Pi Pico board"
  title: "MicroPython on Pi Pico and Projects"
  collection: pico
  url: /pico/
  standards_carrier: pico
  nav_top: true
  blurb: >-
    Get acquainted with the Raspberry Pi Pico and MicroPython: wiring,
    flashing firmware, and physical computing fundamentals. Foundational
    material shared across courses, not specific to any one class.

- id: picoprojects
  title: "Pi Pico Projects"
  url: /picoprojects/
  banner: /assets/img/pico/projects-banner.png
  banner_alt: "Pi Pico Projects: three glowing LEDs and a knob on a dark rose background"
  blurb: >-
    Physical computing with the Raspberry Pi Pico for students who already
    know a little programming: LEDs and PWM, switches, a potentiometer, a
    servo. Each project has slides and a worksheet. A faster, more computer
    science flavored companion to the MicroPython book above.

- id: electronics101
  banner: /assets/img/electronics101/banner.png
  banner_alt: "Electronics 101: a simple circuit with a resistor and a lamp"
  title: "Electronics 101"
  collection: electronics101
  url: /electronics101/
  blurb: >-
    Build nine circuits in Tinkercad, from a single AA cell to a micro:bit
    aiming a servo, then rebuild the last five with real parts. You build
    first and we talk about it after. Foundational material shared across
    courses, meant to run alongside the early Pico lessons.

- id: working-in-python
  title: "Working in Python"
  url: /working-in-python/
  banner: /assets/img/working-in-python/banner.png
  banner_alt: "Working in Python: rows of books on either side of a few lines of Python. Jupyter notebooks that run in your browser"
  blurb: >-
    An AP CSP-oriented adaptation of Allen Downey's <em>Think Python</em>,
    3rd edition (CC BY-NC-SA 4.0). Mirrored here from its own book repo,
    which also publishes independently at
    <a href="https://python.porttack.com">python.porttack.com</a>.

- id: cs50psets
  title: "CS50 Problems"
  collection: cs50psets
  url: /cs50-psets/
  suggest_edits: true
  item_label: "Problem"
  standards_carrier: cs50psets
  banner: /assets/img/cs50psets/banner.png
  banner_alt: "CS50 Problems: CS50 extra problems and practice for CS50 AP and CS50 Python, on a red circuit board"
  blurb: >-
    A mix of problem sets: some adapted from Harvard's CS50 AP and CS50
    Python curricula, some written from scratch by teachers and past
    students of this class. Same standards either way, checked and
    submitted with check50 and submit50.

- id: unplugged
  title: "CS Unplugged"
  collection: unplugged
  url: /unplugged/
  standards_carrier: unplugged
  standards_locator: slug
  banner: /assets/img/unplugged/unplugged-banner.png
  banner_alt: "CS Unplugged: a computer chip with its plug pulled out. Great for subs"
  nav: none
  name_line: true
  suggest_edits: true
  docx_export: true
  blurb: >-
    Computer science with no computer: printable worksheets and pair games
    for brain breaks, computers-down days, or practice on one idea. Many are
    classic Creative Commons and public-domain unplugged activities, rewritten
    as ready-to-print sheets students can do on their own.

- id: movies
  title: "Student Movies"
  collection: movies
  url: /movies/
  banner: /assets/img/movies/movies-banner.png
  banner_alt: "Student Movies: a film frame and a bucket of popcorn. Great for subs"
  nav: none
  blurb: >-
    Movies worth watching in class, each with a trailer, a short summary,
    Common Sense Media and Rotten Tomatoes ratings, and a printable two sided
    worksheet. Questions to answer while you watch, then questions about
    character, feelings and how people treat each other.

- id: rovrobotics
  banner: /assets/img/rovrobotics/banner.png
  banner_alt: "ROV Robotics: a yellow underwater robot with bubbles rising"
  title: "ROV Robotics"
  collection: rovrobotics
  url: /rovrobotics/
  suggest_edits: true
  blurb: >-
    The curriculum and working practices behind a MATE ROV team run as an
    engineering company. Sprints, pool days, design decision records, and a
    library of lesson cards covering water physics, electricity, control,
    software, and ocean science.

- id: jslogo
  banner: /assets/img/jslogo/banner.png
  banner_alt: "Logo: a real Logo interpreter in your browser, drawing tilted squares with a turtle"
  title: "Logo"
  url: /logo/
  blurb: >-
    A real Logo interpreter that runs in your browser: type forward, repeat
    and procedures of your own. It is a copy of Joshua Bell's open source
    JSLogo, kept here so that nothing you type goes to another website.
    TurtleLab's Logo box can open its programs in it.

- id: ap-csp-reference
  banner: /assets/img/ap-csp-reference/banner.png
  banner_alt: "AP CSP Reference: exam pseudocode next to its Python translation"
  title: "AP CSP Reference"
  url: /ap-csp-reference/
  blurb: >-
    Quick-lookup material for AP Computer Science Principles, starting
    with a plain-English guide to the exam's pseudocode language, with a
    Python translation for every construct. Not sequenced lessons, just
    things to check while you work.

- id: standards
  title: "Standards"
  url: /standards/
  banner: /assets/img/standards/standards.png
  banner_alt: "Standards Alignments: a compass rose over a map of intersecting lines with checkmarks"
  blurb: >-
    A visual coverage map across every course and curriculum reviewed here,
    against AP CSP, California 9-12 CS, CSTA 2026, and CA CTE (ICT)
    standards — plus reference pages for each framework and a full
    reverse-map report of which content carries which code.
