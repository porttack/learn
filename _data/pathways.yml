- id: pico
  title: "MicroPython on Raspberry Pi Pico"
  collection: pico
  url: /pico/
  status: in-progress
  blurb: >-
    Get acquainted with the Raspberry Pi Pico and MicroPython: wiring,
    flashing firmware, and physical computing fundamentals. Foundational
    material shared across courses, not specific to any one class.

- id: electronics101
  title: "Electronics 101"
  collection: electronics101
  url: /electronics101/
  status: in-progress
  blurb: >-
    Build nine circuits in Tinkercad, from a single AA cell to a micro:bit
    aiming a servo, then rebuild the last five with real parts. You build
    first and we talk about it after. Foundational material shared across
    courses, meant to run alongside the early Pico lessons.

- id: rovrobotics
  title: "ROV Robotics"
  collection: rovrobotics
  url: /rovrobotics/
  status: in-progress
  blurb: >-
    The curriculum and working practices behind a MATE ROV team run as an
    engineering company. Sprints, pool days, design decision records, and a
    library of lesson cards covering water physics, electricity, control,
    software, and ocean science.

- id: cs50psets
  title: "CS50 Problem Sets"
  collection: cs50psets
  url: /cs50-psets/
  status: in-progress
  item_label: "Problem"
  blurb: >-
    A mix of problem sets: some adapted from Harvard's CS50 AP and CS50
    Python curricula, some written from scratch by teachers and past
    students of this class. Same standards either way, checked and
    submitted with check50 and submit50.

- id: ap-csp-reference
  title: "AP CSP Reference"
  url: /ap-csp-reference/
  status: in-progress
  blurb: >-
    Quick-lookup material for AP Computer Science Principles, starting
    with a plain-English guide to the exam's pseudocode language, with a
    Python translation for every construct. Not sequenced lessons, just
    things to check while you work.

- id: working-in-python
  title: "Working in Python"
  url: /working-in-python/
  status: in-progress
  blurb: >-
    An AP CSP-oriented adaptation of Allen Downey's <em>Think Python</em>,
    3rd edition (CC BY-NC-SA 4.0). Mirrored here from its own book repo,
    which also publishes independently at
    <a href="https://python.porttack.com">python.porttack.com</a>.

- id: standards
  title: "Standards Reference"
  url: /standards/
  status: in-progress
  blurb: >-
    Cross-source lookup for AP CSP, California 9-12 CS, CSTA 2026, and CA
    CTE (ICT) standards, plus a reverse map showing which book chapter, unit
    plan, or lesson carries each code. Not sequenced lessons, a reference.