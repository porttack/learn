const DPR = 2;   // draw at twice the design size so scaled-up slides stay sharp
function useCanvas(w, h, draw) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current;
    c.width = w * DPR; c.height = h * DPR;
    const ctx = c.getContext("2d");
    ctx.scale(DPR, DPR);
    let raf, t0 = null;
    const loop = (ts) => {
      if (t0 === null) t0 = ts;
      draw(ctx, (ts - t0) / 1000, w, h);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ width: w + "px", height: h + "px", display: "block" }} />;
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(" ");
  let line = "", yy = y;
  words.forEach((wd) => {
    const test = line ? line + " " + wd : wd;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = wd; yy += lineH; }
    else line = test;
  });
  if (line) ctx.fillText(line, x, yy);
  return yy + lineH;
}

// ---------- the Argo trip, animated ----------
function CycleCanvas() {
  const draw = useCallback((ctx, t, w, h) => {
    const L = 90, R = 250, T = 30, B = 40, pw = w - L - R, ph = h - T - B;
    const X = (f) => L + f * pw;
    const Y = (m) => T + m / 2000 * ph;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#e4eef6"; ctx.fillRect(L, T, pw, ph);
    ctx.strokeStyle = "#b9cfe2"; ctx.lineWidth = 1; ctx.fillStyle = "#334"; ctx.font = "20px sans-serif";
    ctx.textAlign = "right";
    [0, 1000, 2000].forEach((m) => {
      ctx.beginPath(); ctx.moveTo(L, Y(m)); ctx.lineTo(L + pw, Y(m)); ctx.stroke();
      ctx.fillText(m === 0 ? "surface" : m.toLocaleString("en-US") + " m", L - 10, Y(m) + 7);
    });
    ctx.textAlign = "start";
    // the path: [fraction of the 10 days, depth]
    const pts = [[0, 0], [0.06, 1000], [0.80, 1000], [0.86, 2000], [0.97, 0], [1, 0]];
    ctx.strokeStyle = "#9aa7b4"; ctx.lineWidth = 3; ctx.beginPath();
    pts.forEach((p, i) => { if (i === 0) ctx.moveTo(X(p[0]), Y(p[1])); else ctx.lineTo(X(p[0]), Y(p[1])); });
    ctx.stroke();
    const period = 14, f = (t % period) / period;
    let pos = [0, 0], seg = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      if (f >= pts[i][0] && f <= pts[i + 1][0]) {
        const k = (f - pts[i][0]) / (pts[i + 1][0] - pts[i][0]);
        pos = [f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; seg = i; break;
      }
    }
    ctx.strokeStyle = seg === 3 || seg === 4 ? "#d9480f" : "#0b5cad"; ctx.lineWidth = 5; ctx.beginPath();
    for (let i = 0; i <= seg; i++) {
      const a = pts[i], b = i === seg ? pos : pts[i + 1];
      if (i === 0) ctx.moveTo(X(a[0]), Y(a[1]));
      ctx.lineTo(X(b[0]), Y(b[1]));
    }
    ctx.stroke();
    // labels, each next to the part of the path it describes
    ctx.fillStyle = "#222"; ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "start";
    ctx.fillText("sink to 1,000 m", X(0.075), Y(480));
    ctx.textAlign = "center";
    ctx.fillText("drift with the current, about 9 days", X(0.43), Y(1000) - 16);
    ctx.textAlign = "right";
    ctx.fillText("dive to 2,000 m", X(0.835), Y(1620));
    ctx.textAlign = "start";
    ctx.fillStyle = "#b53a0a";
    ctx.fillText("rise slowly,", X(0.97) + 16, Y(900));

    ctx.fillText("at the top: send", X(1.0) + 16, Y(0) + 24);
    ctx.fillText("data to a satellite", X(1.0) + 16, Y(0) + 52);
    ctx.fillStyle = "#f2c200"; ctx.strokeStyle = "#333"; ctx.lineWidth = 2;

// ---------- the real map ----------
function MapCanvas() {
  const order = useRef(null);
  const draw = useCallback((ctx, t, w, h) => {
    const D = window.FLOAT_DATA;
    const floats = D.snapshot.floats, n = floats.length;
    if (!order.current) {
      order.current = floats.map((_, i) => i);
      let s = 7;
      for (let i = n - 1; i > 0; i--) { s = (s * 1103515245 + 12345) & 0x7fffffff; const j = s % (i + 1); const tmp = order.current[i]; order.current[i] = order.current[j]; order.current[j] = tmp; }
    }
    const MW = 840, mh = 420, ox = Math.round((w - MW) / 2);
    const proj = (lon, lat) => [ox + (lon + 180) / 360 * MW, (85 - lat) / 165 * mh];
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#e4eef6"; ctx.fillRect(ox, 0, MW, mh);
    ctx.strokeStyle = "rgba(60,90,120,0.18)"; ctx.lineWidth = 1;
    for (let lon = -150; lon <= 150; lon += 30) { const p = proj(lon, 0); ctx.beginPath(); ctx.moveTo(p[0], 0); ctx.lineTo(p[0], mh); ctx.stroke(); }
    for (let lat = -60; lat <= 60; lat += 30) { const p = proj(0, lat); ctx.beginPath(); ctx.moveTo(ox, p[1]); ctx.lineTo(ox + MW, p[1]); ctx.stroke(); }
    const reveal = Math.min(1, t / 3.5);
    const shown = Math.floor(reveal * n);
    for (let k = 0; k < shown; k++) {
      const f = floats[order.current[k]], p = proj(f[0], f[1]);
      ctx.fillStyle = f[2] ? "rgba(0,150,140,0.95)" : "rgba(40,58,78,0.75)";
      ctx.fillRect(p[0] - 1.4, p[1] - 1.4, 2.8, 2.8);
    }
    ctx.fillStyle = "#111"; ctx.font = "bold 30px sans-serif";
    ctx.fillText(shown.toLocaleString("en-US") + " floats", ox, mh + 38);
    ctx.font = "21px sans-serif"; ctx.fillStyle = "#444";
    ctx.fillText("One dot per float, where it last reported, 1 to 10 November 2026.", ox, mh + 72);
    ctx.fillText("Teal dots also carry chemistry and biology sensors.", ox, mh + 100);
  }, []);
  return useCanvas(1088, 540, draw);
}

// ---------- real growth, drawn in ----------
function GrowthCanvas() {
  const draw = useCallback((ctx, t, w, h) => {
    const L = 76, R = 150, T = 20, B = 46, pw = w - L - R, ph = h - T - B;
    const N = GROWTH.dates.length, max = 5000;
    const X = (k) => L + k / (N - 1) * pw, Y = (v) => T + ph - v / max * ph;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#e3e6ea"; ctx.fillStyle = "#444"; ctx.font = "20px sans-serif"; ctx.lineWidth = 1; ctx.textAlign = "right";
    for (let v = 0; v <= max; v += 1000) { ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + pw, Y(v)); ctx.stroke(); ctx.fillText(v.toLocaleString("en-US"), L - 8, Y(v) + 7); }
    ctx.textAlign = "center";
    GROWTH.dates.forEach((d, k) => { const yr = parseInt(d.slice(0, 4), 10); if (d.slice(5) === "11" && yr % 5 === 0) ctx.fillText(String(yr), X(k), h - 14); });
    ctx.textAlign = "start";
    const prog = Math.min(1, t / 6), upto = prog * (N - 1);
    [[0, "#34495e", "all floats"], [1, "#00968c", "chemistry and biology"]].forEach((ln) => {
      ctx.strokeStyle = ln[1]; ctx.lineWidth = 4; ctx.beginPath();
      for (let k = 0; k <= Math.floor(upto); k++) { const v = GROWTH.counts[k][ln[0]]; if (k === 0) ctx.moveTo(X(k), Y(v)); else ctx.lineTo(X(k), Y(v)); }
      const k0 = Math.floor(upto), fr = upto - k0;
      if (k0 < N - 1) { const v = GROWTH.counts[k0][ln[0]] + (GROWTH.counts[k0 + 1][ln[0]] - GROWTH.counts[k0][ln[0]]) * fr; ctx.lineTo(X(upto), Y(v)); }
      ctx.stroke();
      const idx = Math.min(N - 1, Math.round(upto)), val = GROWTH.counts[idx][ln[0]];
      ctx.fillStyle = ln[1]; ctx.font = "bold 24px sans-serif";
      ctx.fillText(val.toLocaleString("en-US"), X(upto) + 10, Y(val) + 8);
      ctx.font = "20px sans-serif"; ctx.fillText(ln[2], L + 12, ln[0] === 0 ? T + 24 : T + 52);
    });
    const idx = Math.min(N - 1, Math.round(upto)), d = GROWTH.dates[idx];
    ctx.fillStyle = "#111"; ctx.font = "bold 28px sans-serif";
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    ctx.fillText(months[parseInt(d.slice(5), 10) - 1] + " " + d.slice(0, 4), L + 12, T + 96);
  }, []);
  return useCanvas(1088, 470, draw);
}

// ---------- two oceans, two real floats, cycling through what they measured ----------
const VARS = [
  { key: "temperature", label: "Temperature", unit: "°C", at: 1500, atLabel: "At 1,500 m",
    text: "Both are warm on top and cold below. The Atlantic stays warmer at depth." },
  { key: "salinity", label: "Salinity", unit: "psu", at: 10, atLabel: "Near the surface",
    text: "The Atlantic is the saltiest major ocean, and it shows near the top." },
  { key: "doxy", label: "Oxygen", unit: "µmol/kg", at: 1500, atLabel: "At 1,500 m",
    text: "Deep Atlantic water was at the surface recently, so it is rich in oxygen. Deep North Pacific water has been below a very long time and used it up." },
  { key: "nitrate", label: "Nitrate", unit: "µmol/kg", at: 1500, atLabel: "At 1,500 m",
    text: "Nutrients pile up in old water, so the deep Pacific has far more nitrate." }
];
function nearest(series, z) {
  let best = null, bd = Infinity;
  (series || []).forEach((p) => { const d = Math.abs(p[0] - z); if (d < bd) { bd = d; best = p; } });
  return best;
}
function CompareCanvas() {
  const draw = useCallback((ctx, t, w, h) => {
    const P = window.FLOAT_DATA.profiles;
    const A = P[2], B = P[1];                       // North Atlantic, North Pacific
    const period = 8, k = Math.floor(t / period) % VARS.length, v = VARS[k];
    const fade = Math.min(1, (t % period) / 0.6);
    const L = 74, T = 20, B_ = 52, cw = 560, ph = h - T - B_;
    const sa = A.s[v.key] || [], sb = B.s[v.key] || [];
    let lo = Infinity, hi = -Infinity;
    sa.concat(sb).forEach((p) => { if (p[1] < lo) lo = p[1]; if (p[1] > hi) hi = p[1]; });
    const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
    if (v.key === "doxy" || v.key === "nitrate") lo = Math.max(0, lo);
    const X = (val) => L + (val - lo) / (hi - lo) * (cw - L - 10), Y = (z) => T + z / 2000 * ph;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#e3e6ea"; ctx.fillStyle = "#444"; ctx.font = "19px sans-serif"; ctx.lineWidth = 1; ctx.textAlign = "right";
    for (let z = 0; z <= 2000; z += 500) { ctx.beginPath(); ctx.moveTo(L, Y(z)); ctx.lineTo(cw - 10, Y(z)); ctx.stroke(); ctx.fillText(z === 0 ? "surface" : z.toLocaleString("en-US") + " m", L - 8, Y(z) + 6); }
    ctx.textAlign = "center";
    const step = (hi - lo) / 4;
    for (let i = 0; i <= 4; i++) { const val = lo + i * step; ctx.fillText(val.toFixed(Math.abs(hi) < 10 ? 1 : 0), X(val), h - 26); }
    ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#222";
    ctx.fillText(v.label + " (" + v.unit + ")", L + (cw - L) / 2, h - 4);
    ctx.textAlign = "start";
    ctx.globalAlpha = fade;
    [[sa, "#B3447F"], [sb, "#009E73"]].forEach((pair) => {
      ctx.strokeStyle = pair[1]; ctx.fillStyle = pair[1]; ctx.lineWidth = 4; ctx.beginPath();
      pair[0].forEach((p, i) => { if (i === 0) ctx.moveTo(X(p[1]), Y(p[0])); else ctx.lineTo(X(p[1]), Y(p[0])); });
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    // the right-hand panel
    const x0 = cw + 40, pw2 = w - x0 - 6;
    ctx.fillStyle = "#B3447F"; ctx.fillRect(x0, T + 6, 22, 22);
    ctx.fillStyle = "#222"; ctx.font = "bold 26px sans-serif"; ctx.fillText("North Atlantic", x0 + 32, T + 26);
    ctx.fillStyle = "#009E73"; ctx.fillRect(x0, T + 44, 22, 22);
    ctx.fillStyle = "#222"; ctx.fillText("North Pacific", x0 + 32, T + 64);
    ctx.globalAlpha = fade;
    ctx.fillStyle = "#111"; ctx.font = "bold 30px sans-serif"; ctx.fillText(v.label, x0, T + 120);
    const pa = nearest(sa, v.at), pb = nearest(sb, v.at);
    ctx.font = "24px sans-serif"; ctx.fillStyle = "#555"; ctx.fillText(v.atLabel + ":", x0, T + 160);
    const fmtv = (p) => (p ? (Math.abs(p[1]) >= 100 ? p[1].toFixed(0) : p[1].toFixed(1)) + " " + v.unit : "no reading");
    ctx.fillStyle = "#B3447F"; ctx.font = "bold 28px sans-serif"; ctx.fillText("Atlantic  " + fmtv(pa), x0, T + 200);
    ctx.fillStyle = "#009E73"; ctx.fillText("Pacific   " + fmtv(pb), x0, T + 238);
    ctx.fillStyle = "#222"; ctx.font = "24px sans-serif";
    wrapText(ctx, v.text, x0, T + 284, pw2, 32);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#777"; ctx.font = "17px sans-serif";
    wrapText(ctx, "One real float each (" + A.date + " Atlantic, " + B.date + " Pacific). An example, not a proof.", x0, h - 56, pw2, 22);
  }, []);
  return useCanvas(1088, 540, draw);
}

// ---------- the three simulated floats, looping by themselves ----------
const SIM_NOTES = {
  Steady: "holds its depth and stays off the floor",
  Heavy: "holds, but sinks into the floor",
  Jittery: "the float is fine, the sensor is noisy"
};
function SimCanvas() {
  const draw = useCallback((ctx, t, w, h) => {
    const S = window.FLOAT_SIM, POOL = 3.96, LEN = 0.6, HOLD = 1.0, BAND = 0.33, FLOOR = POOL - LEN;
    const PLAY = 11, HOLDT = 4, per = PLAY + HOLDT;
    const idx = Math.floor(t / per) % S.length, tau = t % per, d = S[idx];
    const p = Math.min(1, tau / PLAY), n = d.log.length;
    const i = Math.max(0, Math.min(n - 1, Math.floor(p * n) - 1));
    const done = p >= 1;
    ctx.clearRect(0, 0, w, h);
    // title line
    ctx.fillStyle = "#111"; ctx.font = "bold 30px sans-serif"; ctx.fillText(d.name, 12, 30);
    ctx.font = "24px sans-serif"; ctx.fillStyle = "#555"; ctx.fillText(SIM_NOTES[d.name] || "", 12 + ctx.measureText(d.name).width * 1.15 + 18, 30);
    // pool, left
    const PW = 200, top = 56, bot = h - 8, span = bot - top, minD = -0.35, maxD = POOL + 0.15;
    const Y = (m) => top + (m - minD) / (maxD - minD) * span;
    ctx.fillStyle = "#cfe6f5"; ctx.fillRect(0, Y(0), PW, Y(POOL) - Y(0));
    ctx.fillStyle = "#9a8f7e"; ctx.fillRect(0, Y(POOL), PW, bot - Y(POOL) + 6);
    ctx.strokeStyle = "#2b6a9b"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(PW, Y(0)); ctx.stroke();
    ctx.fillStyle = "rgba(80,190,100,0.30)"; ctx.fillRect(0, Y(HOLD - BAND), PW, Y(HOLD + BAND) - Y(HOLD - BAND));
    ctx.fillStyle = "#2f7a3a"; ctx.font = "16px sans-serif"; ctx.fillText("hold band", PW - 74, Y(HOLD - BAND) + 16);
    ctx.strokeStyle = "#c92a2a"; ctx.setLineDash([6, 4]); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, Y(FLOOR)); ctx.lineTo(PW, Y(FLOOR)); ctx.stroke(); ctx.setLineDash([]);
    const depth = d.true[i], touching = depth >= FLOOR - 1e-9;
    const fx = PW * 0.58, fw = 28, y0 = Y(depth), y1 = Y(depth + LEN);
    ctx.fillStyle = touching ? "#e03131" : "#f2c200"; ctx.strokeStyle = "#333"; ctx.lineWidth = 1.5;
    ctx.fillRect(fx - fw / 2, y0, fw, y1 - y0); ctx.strokeRect(fx - fw / 2, y0, fw, y1 - y0);
    ctx.beginPath(); ctx.moveTo(fx, y0); ctx.lineTo(fx, y0 - 10); ctx.stroke();
    ctx.fillStyle = "#222"; ctx.font = "bold 16px sans-serif"; ctx.fillText(depth.toFixed(2) + " m", fx + fw / 2 + 6, y0 + 14);
    if (touching) { ctx.fillStyle = "#c92a2a"; ctx.fillText("touching the floor!", 6, Y(POOL) - 8); }
    // graph, right: the packets
    const gx = PW + 70, gR = 14, gw = w - gx - gR, gy = 56, gh = h - 56 - 40, maxT = n, maxD2 = 3.6;
    const GX = (s) => gx + s / maxT * gw, GY = (m) => gy + m / maxD2 * gh;
    ctx.fillStyle = "rgba(80,190,100,0.28)"; ctx.fillRect(gx, GY(HOLD - BAND), gw, GY(HOLD + BAND) - GY(HOLD - BAND));
    ctx.strokeStyle = "#e6e6e6"; ctx.fillStyle = "#444"; ctx.font = "17px sans-serif"; ctx.lineWidth = 1; ctx.textAlign = "right";
    for (let m = 0; m <= 3.5; m += 0.5) { ctx.beginPath(); ctx.moveTo(gx, GY(m)); ctx.lineTo(gx + gw, GY(m)); ctx.stroke(); ctx.fillText(m.toFixed(1), gx - 8, GY(m) + 6); }
    ctx.textAlign = "center";
    for (let s = 0; s <= maxT; s += 20) { ctx.beginPath(); ctx.moveTo(GX(s), gy); ctx.lineTo(GX(s), gy + gh); ctx.stroke(); ctx.fillText(String(s), GX(s), gy + gh + 20); }
    ctx.fillStyle = "#222"; ctx.font = "bold 17px sans-serif"; ctx.fillText("Time (seconds)", gx + gw / 2, h - 4);
    ctx.save(); ctx.translate(gx - 48, gy + gh / 2); ctx.rotate(-Math.PI / 2); ctx.fillText("Depth of the packets (m)", 0, 0); ctx.restore();
    ctx.textAlign = "start";
    ctx.strokeStyle = "#c92a2a"; ctx.setLineDash([6, 4]); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(gx, GY(FLOOR)); ctx.lineTo(gx + gw, GY(FLOOR)); ctx.stroke(); ctx.setLineDash([]);
    if (done && d.hold) { ctx.fillStyle = "rgba(255,200,0,0.35)"; ctx.fillRect(GX(d.hold[0]), gy, GX(d.hold[1]) - GX(d.hold[0]), gh); }
    if (d.settings.noise > 0) {
      ctx.strokeStyle = "#9aa0a6"; ctx.lineWidth = 2; ctx.beginPath();
      for (let k = 0; k <= i; k++) { if (k === 0) ctx.moveTo(GX(k + 1), GY(d.true[k])); else ctx.lineTo(GX(k + 1), GY(d.true[k])); }
      ctx.stroke();
    }
    ctx.strokeStyle = "#0b5cad"; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let k = 0; k <= i; k++) { const px = GX(d.log[k][0]), py = GY(d.log[k][1]); if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.stroke();
    if (done) {   // the judge's verdict, on the title line
      const verdict = "Hold: " + (d.hold ? "yes (+5)" : "FAILED (0)") + "     Floor: " + (d.bottom ? "touched (-5)" : "stayed off (0)") + "     Score: " + d.score;
      ctx.font = "bold 24px sans-serif"; ctx.textAlign = "right";
      ctx.fillStyle = d.score > 0 ? "#2f7a3a" : "#b53a0a";
      ctx.fillText(verdict, w - 12, 30);
      ctx.textAlign = "start";
    }
  }, []);
  return useCanvas(1088, 470, draw);
}

// ---------- slide renderer ----------

function ScaledStage({ slide, aspect }) {
  const outerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const designW = 1280;
  const designH = aspect === "4:3" ? 960 : 720;
  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const recompute = () => {
      const rect = el.getBoundingClientRect();
      const s = Math.min((rect.width * 0.94) / designW, (rect.height * 0.94) / designH);
      setScale(s > 0 ? s : 1);
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener("resize", recompute);
    return () => { ro.disconnect(); window.removeEventListener("resize", recompute); };
  }, [designH]);
  return (
    <div className="stage-outer" ref={outerRef}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center" }}>
        <Stage slide={slide} aspect={aspect} />
      </div>
    </div>
  );
}

function bulletsToText(bullets) { return bullets.map(b => (typeof b === "string" ? b : b.text)).join(" / "); }

function initialStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const slideParam = parseInt(params.get("slide"), 10);
  const index = Number.isInteger(slideParam) ? Math.min(Math.max(slideParam - 1, 0), SLIDES.length - 1) : 0;
  const maxExtra = (SLIDES[index].down || []).length;
  const extraParam = parseInt(params.get("extra"), 10);
  const subIndex = Number.isInteger(extraParam) ? Math.min(Math.max(extraParam, 0), maxExtra) : 0;
  const mode = params.get("outline") ? "outline" : "deck";
  return { index, subIndex, mode };
}

function App() {
  const initial = initialStateFromUrl();
  const [index, setIndex] = useState(initial.index);
  const [subIndex, setSubIndex] = useState(initial.subIndex);
  const [showNotes, setShowNotes] = useState(false);
  const [aspect, setAspect] = useState("16:9");
  const [mode, setMode] = useState(initial.mode);
  const topSlide = SLIDES[index];
  const downSlides = topSlide.down || [];
  const slide = subIndex === 0 ? topSlide : downSlides[subIndex - 1];
  const next = useCallback(() => { setIndex(i => Math.min(i + 1, SLIDES.length - 1)); setSubIndex(0); }, []);
  const prev = useCallback(() => { setIndex(i => Math.max(i - 1, 0)); setSubIndex(0); }, []);
  const goDown = useCallback(() => setSubIndex(s => Math.min(s + 1, downSlides.length)), [downSlides.length]);
  const goUp = useCallback(() => setSubIndex(s => Math.max(s - 1, 0)), []);
  useEffect(() => {
    function onKey(e) {
      if (mode !== "deck") { if (e.key === "Escape") setMode("deck"); return; }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); goDown(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); goUp(); }
      else if (e.key === "n" || e.key === "N") setShowNotes(v => !v);
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "o" || e.key === "O") setMode("outline");
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [mode, next, prev, goDown, goUp]);
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }
  if (mode === "outline") {
    return (
      <div className="app">
        <div className="toolbar">
          <a className="back-link" href="/cs50-psets/float-profile/">&larr; Profiling Float</a>
          <div className="spacer"></div>
          <button onClick={() => setMode("deck")}>Back to slides (Esc)</button>
          <button onClick={() => window.print()}>Print</button>
        </div>
        <Outline />
      </div>
    );
  }
  const hasVideo = slide.kind === "video";
  return (
    <div className="app">
      <div className="stage-outer" style={{ position: "relative" }}>
        <ScaledStage slide={slide} aspect={aspect} />
        <div className="click-zone left" onClick={prev} title="Previous slide"></div>
        <div className="click-zone right" onClick={next} title="Next slide"></div>
        {subIndex > 0 && (
          <button className="depth-nav depth-up" onClick={goUp} title="Back to the main flow">&#9650; Back</button>
        )}
        {subIndex < downSlides.length && (
          <button className="depth-nav depth-down" onClick={goDown} title="More about this slide">&#9660; More</button>
        )}
        <div className="slide-counter-badge">
          {index + 1} / {SLIDES.length}
          {subIndex > 0 && <span> &middot; extra {subIndex}/{downSlides.length}</span>}
        </div>
      </div>
      {showNotes && (
        <div className="notes-panel">
          <h3>Speaker notes</h3>
          <p>{slide.notes}</p>
        </div>
      )}
      <div className="toolbar">
        <a className="back-link" href="/cs50-psets/float-profile/">&larr; Profiling Float</a>
        <div className="spacer"></div>
        <button onClick={prev} disabled={index === 0}>&larr; Prev</button>
        <span className="counter">{index + 1} / {SLIDES.length}</span>
        <button onClick={next} disabled={index === SLIDES.length - 1}>Next &rarr;</button>
        <button className={showNotes ? "active" : ""} onClick={() => setShowNotes(v => !v)}>Notes (N)</button>
        <button onClick={() => setMode("outline")}>Print notes (O)</button>
        <button onClick={() => setAspect(a => a === "16:9" ? "4:3" : "16:9")}>{aspect}</button>
        <button onClick={toggleFullscreen}>Fullscreen (F)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>
</body>
</html>
