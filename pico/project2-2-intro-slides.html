<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project 2.2: Reading a Potentiometer -- Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/assets/img/pico/favicon.svg">
<style>
  :root {
    --accent: #2a7ae2;
    --ink: #1b1f23;
    --paper: #ffffff;
    --muted: #57606a;
    --border: #d0d7de;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #e9edf1;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #root { height: 100%; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .stage-outer {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }

  /* Fixed-size design canvas, scaled to fit via a JS-computed transform --
     lets every slide be authored at generous, fixed pixel sizes ("bigger
     type") without hand-tuning responsive font sizes per breakpoint. */
  .stage {
    width: 1280px;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.18);
    padding: 80px 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 0 0 auto;
  }

  .stage.ar-16-9 { height: 720px; }
  .stage.ar-4-3 { height: 960px; }

  .pot-slide { padding-top: 56px; padding-bottom: 40px; }
  .pot-slide .slide-title { font-size: 52px; margin-bottom: 14px; }
  .pot-slide .kicker { margin-bottom: 8px; }
  .pot-demo { display: flex; gap: 28px; align-items: center; }
  .pot-demo svg { flex: 0 0 700px; width: 700px; height: auto; }
  .pot-demo svg text { fill: currentColor; font-family: inherit; font-size: 18px; }
  .pot-demo .pd-mono { font-family: "Courier New", Courier, monospace; }
  .pot-panel { flex: 1; font-size: 22px; }
  .pot-panel table { width: 100%; border-collapse: collapse; font-family: "Courier New", Courier, monospace; }
  .pot-panel td { border-top: 1px solid var(--border); padding: 6px 4px; }
  .pot-panel td:last-child { text-align: right; font-weight: bold; }
  .pot-panel tr.pot-v td:last-child { font-size: 30px; }
  .pot-panel tr.pot-v td { border-top: 2px solid var(--ink); }
  .pot-controls { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 22px; }
  .pot-controls input[type=range] { width: 100%; height: 28px; }
  .pot-controls select, .pot-controls button { font-size: 22px; padding: 4px 14px; }

  .kicker {
    font-size: 28px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  .slide-title {
    font-size: 64px;
    line-height: 1.1;
    margin: 0 0 40px;
    font-weight: 700;
  }

  .slide-body {
    font-size: 36px;
    line-height: 1.5;
  }

  .slide-body ul {
    margin: 0;
    padding-left: 1.1em;
  }

  .slide-body li {
    margin-bottom: 22px;
  }

  .slide-body li:last-child { margin-bottom: 0; }

  .slide-body a {
    color: var(--accent);
  }

  .slide-image-row {
    display: flex;
    gap: 40px;
    align-items: center;
    margin-top: 20px;
  }

  .slide-image-row img {
    max-height: 260px;
    max-width: 620px;
    flex: 0 1 auto;
    min-width: 0;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .slide-image-row .slide-body {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 30px;
  }

  .slide-image-row .slide-body li {
    margin-bottom: 16px;
  }

  .slide-image-stack img {
    display: block;
    max-width: 100%;
    max-height: 240px;
    margin: 0 auto 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .slide-image-stack .slide-body {
    font-size: 32px;
  }

  .depth-nav {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 14px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    z-index: 3;
  }

  .depth-nav.depth-up {
    bottom: auto;
    top: 14px;
  }

  .depth-nav:hover {
    background: rgba(0,0,0,0.75);
  }

  .title-slide {
    text-align: left;
    justify-content: center;

  .title-slide .slide-title {
    font-size: 76px;
    margin-bottom: 16px;
  }

  .title-slide .slide-subtitle {
    font-size: 34px;

  .challenge-slide {

    color: #6b3fd4;

  .slide-counter-badge {
    position: absolute;

  .toolbar {
    flex: 0 0 auto;

    gap: 10px;
    padding: 10px 16px;

    background: #333a42;
    color: #fff;
    border: 1px solid #4a545e;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;

  .toolbar button:hover { background: #444e58; }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }

  .toolbar .spacer { flex: 1 1 auto; }

  .toolbar a.back-link { color: #9db8e8; text-decoration: none; font-size: 14px; }

    line-height: 1.5;

  .notes-panel h3 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;

  .click-zone {

    top: 0;

    width: 30%;

  .click-zone.left { left: 0; }
  .click-zone.right { right: 0; }

{% raw %}
const { useState, useEffect, useRef, useCallback } = React;

// Edit this array to change the deck. `bullets` is what students see on the
// slide (keep it short, they're reading fast); `notes` is only ever shown in
// the notes panel or the printable outline, so it can be a full paragraph.
//
// The challenge slide keeps the lesson page's no-spoiler rule: it names the
// goal and the tools (Pin vs PWM, three ways to reach leds.py), never the
// assembled if/elif/elif/else chain. Anything more revealing belongs in
// `notes`, which only the teacher sees, not projected to the whole room.
const SLIDES = [
  {
    "kind": "title",
    "kicker": "Project 2.2",
    "title": "Reading a Potentiometer",
    "subtitle": "What a knob is actually telling the Pico",
    "notes": "One class period. Students already have the servo from 2.1 and a working leds.py habit. The new ideas: an analog input is a ratio of voltages, and a list of readings is how you tame noise. The list work (append, len, index) is deliberate practice for AP CSP, so use the vocabulary out loud every time."
  },
  {
    "kind": "bullets",
    "kicker": "Until now",
    "title": "Pins Were On or Off",
    "bullets": [
      "Every pin you have used so far: fully on or fully off",
      "A knob can sit anywhere in between",
      "How does the Pico read \"in between\"?"
    ],
    "notes": "Open with the question and let a few students guess before moving on. Hold up a potentiometer and turn it."
  },
  {
    "kind": "bullets",
    "kicker": "The physics",
    "title": "A Knob Is Two Resistors",
    "bullets": [
      "Inside: one strip of resistor, with a wiper sliding along it",
      "The wiper splits it into two resistors in series, with the same current through both",
      "Ohm's law: V = I × R",
      "Wiper voltage = 3.3 × R_bottom / R_total"
    ],
    "notes": "The next slide is the animated pot. Walk the Ohm's law steps: one current through the whole strip (I = 3.3 / R_total), then V_wiper = I times R_bottom, and the current cancels. Switch the animation from 10k to 1k: the current is ten times bigger but the wiper voltage does not move, which is why either pot works. The ADC pin draws very little current, so it just reads the divider's voltage. They check the formula with a multimeter at the end of class."
  },
  {
    "kind": "pot",
    "kicker": "Try it",
    "title": "Drag the Knob",
    "notes": "Drag the slider or press Sweep and ask what the wiper voltage will be before each stop. Point at R_bottom over R_total: at the middle it is half, so half of 3.3V. Then switch Pot from 10k to 1k. The current jumps to ten times as big but the wiper voltage does not move, because only the fraction matters. The same animation is in the lesson page. Note: arrow keys move the slider while it has focus; click the slide background to give the arrow keys back to the deck."
  },
  {
    "kind": "bullets",
    "kicker": "Wiring",
    "title": "Three Wires",
    "bullets": [
      "Outer leg to 3V3",
      "Outer leg to GND",
      "Wiper (middle) to GP26"
    ],
    "notes": "Same rails as Project 2.1's servo power. Walk the room and check wiper placement before anyone plugs in. Only GP26, GP27 and GP28 read voltage; every other pin is purely digital, so a wiper on GP9 will not work.",
    "down": [
      {
        "kind": "bullets",
        "kicker": "Why not 5V?",
        "title": "Never VBUS or VSYS",
        "bullets": [
          "VBUS and VSYS are 5V",
          "The Pico's ADC only reads up to 3.3V",
          "Above that the reading clips at the maximum and stops responding",
          "Only GP26, 27 and 28 can read voltage"
        ],
        "notes": "An easy mistake to repeat with the joystick later, which is wired the same way. A clipped reading looks like a dead knob, which is a good debugging story."
      }
    ]
  },
  {
    "kind": "bullets",
    "kicker": "Reading it",
    "title": "Knob to Number",
    "bullets": [
      "pot = ADC(Pin(26))",
      "pot.read_u16() gives 0 to 65535",
      "65535 means the full 3.3V",
      "volts = raw / 65535 * 3.3"
    ],
    "notes": "u16 means an unsigned 16-bit integer: 2 to the 16th is 65536 values. Connect to the binary work from Project 1.4 if it helps."
  },
  {
    "kind": "bullets",
    "kicker": "Predict",
    "title": "Knob in the Middle",
    "bullets": [
      "What raw number do you expect?",
      "What voltage?",
      "Write your guess, then run it"
    ],
    "notes": "Expect about 32768 and 1.65V. Real knobs land near it, not on it. That gap sets up the next slide."
  },
  {
    "kind": "bullets",
    "kicker": "A problem",
    "title": "One Reading Wobbles",
    "bullets": [
      "Hold the knob perfectly still",
      "Read it again and again",
      "The number keeps changing"
    ],
    "notes": "Do this live if you can: a loop that prints a single read_u16() with the knob untouched. Ask where the wobble could come from before telling them."
  },
  {
    "kind": "bullets",
    "kicker": "New data structure",
    "title": "Collect Readings in a List",
    "bullets": [
      "samples = [] starts an empty list",
      "samples.append(pot.read_u16()) adds one element",
      "Do it 8 times in a for loop",
      "len(samples) is how many elements it holds"
    ],
    "notes": "This replaces the one-line sum(... for _ in range(8)). Same result, but now the readings exist as data they can look at. Ask: what does len(samples) return after 3 iterations?"
  },
  {
    "kind": "bullets",
    "kicker": "AP vocabulary",
    "title": "Say It Out Loud",
    "bullets": [
      "list: ordered collection under one name",
      "element: one value in the list",
      "index: its position, counting from 0",
      "iteration: one pass through the loop"
    ],
    "notes": "These four match the grey strips on the worksheet. samples[0] is the first element and samples[7] the last. Use the words, not 'thing' or 'spot'."
  },
  {
    "kind": "bullets",
    "kicker": "Look at your data",
    "title": "print(samples)",
    "bullets": [
      "Knob held still",
      "You expect 8 identical numbers",
      "You get 8 slightly different ones"
    ],
    "notes": "Have students read two or three of their lists aloud to a neighbor. Different Picos, different lists, same behavior. Remind them to remove the print before using the plotter."
  },
  {
    "kind": "bullets",
    "kicker": "Challenge",
    "title": "Measure the Spread",
    "bullets": [
      "spread = biggest reading minus smallest",
      "Two list tools: max() and min()",
      "Print it next to your voltage",
      "Record it with the knob low, middle, high"
    ],
    "notes": "No-spoiler rule: name the goal and the tools, never write the spread line on screen. The worksheet's Section E asks for the same number from their own data. The spread is electrical noise; it is the reason we average.",
    "challenge": true,
    "down": [
      {
        "kind": "bullets",
        "kicker": "If a group is stuck",
        "title": "A Nudge, Not the Answer",
        "bullets": [
          "What does max(samples) give you?",
          "What does min(samples) give you?",
          "What do you do to two numbers to find the gap between them?"
        ],
        "notes": "Three guiding questions, not a solution. Use only with a group that is stuck."
      }
    ]
  },
  {
    "kind": "bullets",
    "kicker": "Why average",
    "title": "Noise Cancels Out",
    "bullets": [
      "Each reading is off by a little, in either direction",
      "raw = sum(samples) // len(samples)",
      "The average is closer to the truth than any one reading",
      "// divides and drops the remainder"
    ],
    "notes": "A single reading can be off by about the spread; the average of eight is much closer. The average of the sample list from the worksheet is about 31300; // drops the remainder, so the exact value is 31307 even though the true average is 31307.5."
  },
  {
    "kind": "bullets",
    "kicker": "Check the claim",
    "title": "Prove It With a Multimeter",
    "bullets": [
      "Measure wiper to ground while the program runs",
      "Compare to what the Pico prints",
      "Unplug, then measure R_bottom and R_total",
      "Calculate 3.3 * R_bottom / R_total"
    ],
    "notes": "Their 3V3 rail may read nearer 3.25V than 3.3. That is the point: the program has been running on an assumption. Section B of the worksheet records five knob positions."
  },
  {
    "kind": "bullets",
    "kicker": "Paper time",
    "title": "The Worksheet",
    "bullets": [
      "A: check your wiring",
      "B: five knob positions, two voltages",
      "C: the voltage divider on paper",
      "D: lists on paper, before touching code",
      {"text":"E and F: your own data, then why we average","href":"/pico/project2-2-worksheet/"}
    ],
    "notes": "Link: /pico/project2-2-worksheet/. Print the two pages front and back. Section D is meant to be done on paper first, so students predict samples[8] before they ever see an IndexError."
  },
  {
    "kind": "bullets",
    "kicker": "Next",
    "title": "Where This Goes",
    "bullets": [
      "Turning the knob reliably changes your printed voltage",
      "You can explain why",
      "Project 2.3: that same number lights a NeoPixel bar"
    ],
    "notes": "Do not move on until students can explain the voltage divider and the reason for averaging in their own words. The same raw and volts variables feed Project 2.3 unchanged."
  },
  {
    "kind": "title",
    "title": "Questions?",
    "subtitle": "Wire it up.",
    "notes": "Open the floor briefly, then get Picos plugged in."
  }
];

// A bullet is either a plain string, or { text, href } to render as a link
// (used for pointing straight at the chapter or the Notes page).
function renderBullets(bullets) {
  return (
    <ul>
      {bullets.map((b, i) => (
        <li key={i}>{typeof b === "string" ? b : <a href={b.href}>{b.text}</a>}</li>
      ))}
    </ul>
  );
}

function PotDemo() {
  const [pos, setPos] = useState(50);
  const [rtotal, setRtotal] = useState(10);
  const [sweeping, setSweeping] = useState(false);
  const dirRef = useRef(1);
  useEffect(() => {
    if (!sweeping) return;
    const id = setInterval(() => {
      setPos(p => {
        let n = p + dirRef.current * 2;
        if (n >= 100) { n = 100; dirRef.current = -1; } else if (n <= 0) { n = 0; dirRef.current = 1; }
        return n;
      });
    }, 30);
    return () => clearInterval(id);
  }, [sweeping]);

  const TOP = 60, BOT = 260, SPAN = BOT - TOP;
  const t = pos / 100;                      // 0 = wiper at the GND end, 1 = at the 3V3 end
  const rb = t * rtotal, rtop = rtotal - rb;
  const cur = 3.3 / rtotal;                 // milliamps (resistance is in kilohms)
  const v = cur * rb;                       // Ohm's law across R_bottom
  const wy = BOT - SPAN * t;
  const zig = (y1, y2) => {
    const len = y2 - y1;
    if (len < 1) return "";
    const n = Math.max(2, Math.round(len / 10));
    let d = "M100," + y1;
    for (let i = 1; i < n; i++) d += " L" + (i % 2 ? 114 : 86) + "," + (y1 + len * i / n);
    return d + " L100," + y2;
  };
  const rad = (-135 + 270 * t) * Math.PI / 180;
  return (
    <div className="pot-demo">
      <svg viewBox="-100 0 660 320" role="img" aria-label="A potentiometer drawn as a resistor with a sliding wiper that splits it into R top and R bottom">
        <defs>
          <marker id="pot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>
        <g stroke="currentColor" strokeWidth="2" fill="none">
          <line x1="100" y1="34" x2="100" y2="60" />
          <line x1="100" y1="260" x2="100" y2="286" />
          <path d={zig(TOP, wy)} stroke="#b5541c" strokeWidth="3" />
          <path d={zig(wy, BOT)} stroke="#1a6fb5" strokeWidth="3" />
          <line x1="214" y1={wy} x2="112" y2={wy} strokeWidth="3" markerEnd="url(#pot-arrow)" />
          <rect x="380" y="60" width="36" height="200" />
          <circle cx="512" cy="160" r="44" />
          <line x1="512" y1="160" x2={512 + 38 * Math.sin(rad)} y2={160 - 38 * Math.cos(rad)} strokeWidth="4" />
        </g>
        <rect x="381" y={BOT - SPAN * t} width="34" height={SPAN * t} fill="#2a7ae2" opacity="0.75" />
        <text x="100" y="24" textAnchor="middle">3V3</text>
        <text x="100" y="306" textAnchor="middle">GND</text>
        <text x="222" y={wy + 6}>wiper, to GP26</text>
        {wy - TOP > 24 && <text x="76" y={(TOP + wy) / 2 + 6} textAnchor="end" className="pd-mono">R_top {rtop.toFixed(1)}k</text>}
        {BOT - wy > 24 && <text x="76" y={(wy + BOT) / 2 + 6} textAnchor="end" className="pd-mono">R_bottom {rb.toFixed(1)}k</text>}
        <text x="398" y="50" textAnchor="middle">wiper voltage</text>
        <text x="424" y="72" className="pd-mono">3.3 V</text>
        <text x="424" y="260" className="pd-mono">0 V</text>
        <text x="398" y="284" textAnchor="middle" className="pd-mono" fontWeight="bold">{v.toFixed(2)} V</text>
        <text x="512" y="226" textAnchor="middle">knob</text>
      </svg>
      <div className="pot-panel">
        <table><tbody>
          <tr><td>R_top</td><td>{rtop.toFixed(2)} k</td></tr>
          <tr><td>R_bottom</td><td>{rb.toFixed(2)} k</td></tr>
          <tr><td>I = 3.3/R_total</td><td>{cur.toFixed(2)} mA</td></tr>
          <tr className="pot-v"><td>V = I x R_bottom</td><td>{v.toFixed(2)} V</td></tr>
          <tr><td>read_u16()</td><td>{Math.round(t * 65535)}</td></tr>
        </tbody></table>
        <div className="pot-controls">
          <input type="range" min="0" max="100" step="1" value={pos} aria-label="Knob position"
                 onChange={e => { setSweeping(false); setPos(parseInt(e.target.value, 10)); }} />
          <label>Pot <select value={rtotal} onChange={e => setRtotal(parseFloat(e.target.value))}>
            <option value="10">10k</option><option value="1">1k</option></select></label>
          <button onClick={() => setSweeping(x => !x)}>{sweeping ? "Stop" : "Sweep"}</button>
        </div>
      </div>
    </div>
  );
}

function Stage({ slide, aspect }) {
  const arClass = aspect === "4:3" ? "ar-4-3" : "ar-16-9";
  if (slide.kind === "title") {
    return (
      <div className={"stage title-slide " + arClass}>
        {slide.kicker && <p className="kicker">{slide.kicker}</p>}
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
      </div>
    );
  }
  if (slide.kind === "pot") {
    return (
      <div className={"stage pot-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <PotDemo />
      </div>
    );
  }
  if (slide.kind === "image") {
    const rowClass = slide.wide ? "slide-image-stack" : "slide-image-row";
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className={rowClass}>
          <img src={slide.image} alt="" />
          <div className="slide-body">{renderBullets(slide.bullets)}</div>
        </div>
      </div>
    );
  }
  const extraClass = slide.challenge ? " challenge-slide" : "";
  return (
    <div className={"stage " + arClass + extraClass}>
      <p className="kicker">{slide.kicker}</p>
      <h1 className="slide-title">{slide.title}</h1>
      <div className="slide-body">{renderBullets(slide.bullets)}</div>
    </div>
  );
}

function ScaledStage({ slide, aspect }) {
  const outerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const designW = 1280;
  const designH = aspect === "4:3" ? 960 : 720;

  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const recompute = () => {
      const rect = el.getBoundingClientRect();
      const s = Math.min((rect.width * 0.98) / designW, (rect.height * 0.98) / designH);
      setScale(s > 0 ? s : 1);
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener("resize", recompute);
    return () => { ro.disconnect(); window.removeEventListener("resize", recompute); };
  }, [designH]);

  return (
    <div className="stage-outer" ref={outerRef}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center" }}>
        <Stage slide={slide} aspect={aspect} />
      </div>
    </div>
  );
}

function bulletsToText(bullets) {
  return bullets.map(b => (typeof b === "string" ? b : b.text)).join(" / ");
}

function OutlineCard({ slide, heading, nested }) {
  return (
    <div className={"outline-slide" + (nested ? " outline-nested" : "")}>
      {nested ? <h3>{heading}</h3> : <h2>{heading}</h2>}
      {slide.bullets && <p className="outline-bullets">On slide: {bulletsToText(slide.bullets)}</p>}
      <div className="outline-notes"><p>{slide.notes}</p></div>
    </div>
  );
}

function Outline() {
  return (
    <div className="outline">
      <h1>Project 2.2: Reading a Potentiometer</h1>
      <p className="outline-sub">Speaker notes outline. Print this before class if you'd rather have paper than toggle notes on screen. Indented cards are optional "down arrow" detail, skipped by the normal next/prev flow.</p>
      {SLIDES.map((s, i) => (
        <React.Fragment key={i}>
          <OutlineCard slide={s} heading={`${i + 1}. ${s.title}`} />
          {(s.down || []).map((d, j) => (
            <OutlineCard slide={d} heading={`Extra: ${d.title}`} nested key={j} />
          ))}
        </React.Fragment>
      ))}
    </div>
  );
}

// Deep-linking: ?slide=3 opens on that slide (1-indexed, to match the
// on-screen counter), ?extra=1 additionally drops into that slide's Nth
// "down" slide if it has any, ?outline=1 opens straight into the
// speaker-notes outline -- handy for linking straight to a specific slide,
// or handing a substitute teacher the notes view without them finding the
// button.
function initialStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const slideParam = parseInt(params.get("slide"), 10);
  const index = Number.isInteger(slideParam) ? Math.min(Math.max(slideParam - 1, 0), SLIDES.length - 1) : 0;
  const maxExtra = (SLIDES[index].down || []).length;
  const extraParam = parseInt(params.get("extra"), 10);
  const subIndex = Number.isInteger(extraParam) ? Math.min(Math.max(extraParam, 0), maxExtra) : 0;
  const mode = params.get("outline") ? "outline" : "deck";
  return { index, subIndex, mode };
}

function App() {
  const initial = initialStateFromUrl();
  const [index, setIndex] = useState(initial.index);
  const [subIndex, setSubIndex] = useState(initial.subIndex);
  const [showNotes, setShowNotes] = useState(false);
  const [aspect, setAspect] = useState("16:9");
  const [mode, setMode] = useState(initial.mode); // "deck" | "outline"

  const topSlide = SLIDES[index];
  const downSlides = topSlide.down || [];
  const slide = subIndex === 0 ? topSlide : downSlides[subIndex - 1];

  const next = useCallback(() => { setIndex(i => Math.min(i + 1, SLIDES.length - 1)); setSubIndex(0); }, []);
  const prev = useCallback(() => { setIndex(i => Math.max(i - 1, 0)); setSubIndex(0); }, []);
  const goDown = useCallback(() => setSubIndex(s => Math.min(s + 1, downSlides.length)), [downSlides.length]);
  const goUp = useCallback(() => setSubIndex(s => Math.max(s - 1, 0)), []);

  useEffect(() => {
    function onKey(e) {
      // Let a focused slider, select or button use its own keys (the pot demo has them).
      const tag = e.target && e.target.tagName;
      if (tag === "INPUT" || tag === "SELECT") return;
      if (tag === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
      if (mode !== "deck") {
        if (e.key === "Escape") setMode("deck");
        return;
      }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); goDown(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); goUp(); }
      else if (e.key === "n" || e.key === "N") setShowNotes(v => !v);
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "o" || e.key === "O") setMode("outline");
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [mode, next, prev, goDown, goUp]);

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  if (mode === "outline") {
    return (
      <div className="app">
        <div className="toolbar">
          <a className="back-link" href="/pico/project2-2-reading-a-potentiometer/">&larr; Project 2.2</a>
          <div className="spacer"></div>
          <button onClick={() => setMode("deck")}>Back to slides (Esc)</button>
          <button onClick={() => window.print()}>Print</button>
        </div>
        <Outline />
      </div>
    );
  }

  return (
    <div className="app">
      <div className="stage-outer" style={{ position: "relative" }}>
        <ScaledStage slide={slide} aspect={aspect} />
        <div className={"click-zone left" + (slide.kind === "pot" ? " narrow" : "")} onClick={prev} title="Previous slide"></div>
        <div className={"click-zone right" + (slide.kind === "pot" ? " narrow" : "")} onClick={next} title="Next slide"></div>
        {subIndex > 0 && (
          <button className="depth-nav depth-up" onClick={goUp} title="Back to the main flow">&#9650; Back</button>
        )}
        {subIndex < downSlides.length && (
          <button className="depth-nav depth-down" onClick={goDown} title="More about this slide">&#9660; More</button>
        )}
        <div className="slide-counter-badge">
          {index + 1} / {SLIDES.length}
          {subIndex > 0 && <span> &middot; extra {subIndex}/{downSlides.length}</span>}
        </div>
      </div>
      {showNotes && (
        <div className="notes-panel">
          <h3>Speaker notes</h3>
          <p>{slide.notes}</p>
        </div>
      )}
      <div className="toolbar">
        <a className="back-link" href="/pico/project2-2-reading-a-potentiometer/">&larr; Project 2.2</a>
        <div className="spacer"></div>
        <button onClick={prev} disabled={index === 0}>&larr; Prev</button>
        <span className="counter">{index + 1} / {SLIDES.length}</span>
        <button onClick={next} disabled={index === SLIDES.length - 1}>Next &rarr;</button>
        <button className={showNotes ? "active" : ""} onClick={() => setShowNotes(v => !v)}>Notes (N)</button>
        <button onClick={() => setMode("outline")}>Print notes (O)</button>
        <button onClick={() => setAspect(a => a === "16:9" ? "4:3" : "16:9")}>{aspect}</button>
        <button onClick={toggleFullscreen}>Fullscreen (F)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>
</body>
</html>
