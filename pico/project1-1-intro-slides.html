<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project 1.1: Wiring Three LEDs -- Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/assets/img/pico/favicon.svg">
<style>
  :root {
    --accent: #2a7ae2;
    --ink: #1b1f23;
    --paper: #ffffff;
    --muted: #57606a;
    --border: #d0d7de;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #e9edf1;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #root { height: 100%; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .stage-outer {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }

  /* Fixed-size design canvas, scaled to fit via a JS-computed transform --
     lets every slide be authored at generous, fixed pixel sizes ("bigger
     type") without hand-tuning responsive font sizes per breakpoint. */
  .stage {
    width: 1280px;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.18);
    padding: 80px 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 0 0 auto;
  }

  .stage.ar-16-9 { height: 720px; }
  .stage.ar-4-3 { height: 960px; }

  .kicker {
    font-size: 28px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  .slide-title {
    font-size: 64px;
    line-height: 1.1;
    margin: 0 0 40px;
    font-weight: 700;
  }

  .slide-body {
    font-size: 36px;
    line-height: 1.5;
  }

  .slide-body ul {
    margin: 0;
    padding-left: 1.1em;
  }

  .slide-body li {
    margin-bottom: 22px;
  }

  .slide-body li:last-child { margin-bottom: 0; }

  .slide-image-row {
    display: flex;
    gap: 40px;
    align-items: center;
    margin-top: 20px;
  }

  .slide-image-row img {
    max-height: 260px;
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .slide-image-row .slide-body {
    flex: 1 1 auto;
    font-size: 30px;
  }

  .slide-image-row .slide-body li {
    margin-bottom: 16px;
  }

  .slide-body a, .slide-image-row .slide-body a {
    color: var(--accent);
  }

  .slide-gallery-row {
    display: flex;
    gap: 30px;
    margin-top: 20px;
    align-items: flex-start;
  }

  .slide-gallery-item {
    flex: 1 1 0;
    text-align: center;
  }

  .slide-gallery-item img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .slide-gallery-item .caption {
    margin-top: 14px;
    font-size: 22px;
    line-height: 1.3;
  }

  .depth-nav {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 14px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    z-index: 3;
  }

  .depth-nav.depth-up {
    bottom: auto;
    top: 14px;
  }

  .depth-nav:hover {
    background: rgba(0,0,0,0.75);
  }

  .title-slide {
    text-align: left;
    justify-content: center;
  }

  .title-slide .slide-title {
    font-size: 76px;
    margin-bottom: 16px;
  }

  .title-slide .slide-subtitle {
    font-size: 34px;
    color: var(--muted);
  }

  .safety-slide {
    background: #fff7e6;
  }

  .safety-slide .kicker {
    color: #b25e00;
  }

  .slide-counter-badge {
    position: absolute;
    bottom: 18px;
    right: 24px;
    font-size: 15px;
    color: var(--muted);
  }

  /* --- Toolbar (not part of the scaled stage, so it stays a readable,
     fixed size regardless of projector distance / zoom level) --- */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #1b1f23;
    color: #fff;
    font-size: 14px;
    flex-wrap: wrap;
  }

  .toolbar button {
    background: #333a42;
    color: #fff;
    border: 1px solid #4a545e;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }

  .toolbar button:hover { background: #444e58; }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }

  .toolbar .spacer { flex: 1 1 auto; }
  .toolbar .counter { min-width: 4.5em; text-align: center; }
  .toolbar a.back-link { color: #9db8e8; text-decoration: none; font-size: 14px; }
  .toolbar a.back-link:hover { text-decoration: underline; }

  /* --- Speaker notes panel: docked below the stage, plain readable text,
     hidden by default so a mirrored/projected display shows a clean deck. --- */
  .notes-panel {
    flex: 0 0 auto;
    background: #f6f8fa;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    max-height: 26vh;
    overflow-y: auto;
    font-size: 17px;
    line-height: 1.5;
  }

  .notes-panel h3 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    cursor: pointer;
  }
  .click-zone.left { left: 0; }
  .click-zone.right { right: 0; }

  /* --- Outline / print-notes view: a plain scrollable page listing every
     slide with its full speaker notes, meant for printing ahead of class. --- */
  .outline {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    overflow-y: auto;
    height: 100%;
  }

  .outline h1 { margin-bottom: 4px; }
  .outline .outline-sub { color: var(--muted); margin-top: 0; }

  .outline-slide {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin: 20px 0;
    break-inside: avoid;
  }

  .outline-slide h2 {
    margin: 0 0 8px;
    font-size: 22px;
  }

  .outline-slide.outline-nested {
    margin: 12px 0 12px 32px;
    background: #f6f8fa;
    border-style: dashed;
  }

  .outline-slide h3 {
    margin: 0 0 6px;
    font-size: 18px;
    color: var(--muted);
  }

  .outline-slide .outline-bullets {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 14px;
  }

  .outline-slide .outline-notes {
    font-size: 16px;
    line-height: 1.5;
  }

  .outline-slide .outline-notes p:first-child { margin-top: 0; }

  @media print {
    .toolbar { display: none !important; }
    .outline { height: auto; overflow: visible; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module">
{% raw %}
const { useState, useEffect, useRef, useCallback } = React;

// Edit this array to change the deck. `bullets` is what students see on the
// slide (keep it short, they're reading fast); `notes` is only ever shown in
// the notes panel or the printable outline, so it can be a full paragraph.
// A bullet can be a plain string, or { text, href } to render as a link.
//
// This is a pure wiring day: no computer, no code, and deliberately no
// mention of what the circuit will eventually do -- just the physical
// build (wire color, which rail, how to find a cathode once the legs are
// trimmed). No DIP switch today either; that's a separate future session.
const SLIDES = [
  {
    kind: "title",
    kicker: "Project 1.1",
    title: "Wiring Three LEDs",
    subtitle: "Your own wire, no code yet",
    notes: "Pure wiring day: no simulator, no computer required yet, and no code or future-use talk either, just the physical build. This is also a class neatness competition, judging details to come from the teacher separately."
  },
  {
    kind: "bullets",
    kicker: "Why hand-wired?",
    title: "Not Jumper Wires Today",
    bullets: [
      "Dupont connectors are famously fragile",
      "They pull loose easily and never look as neat",
      "You'll cut and strip your own 22-gauge wire instead"
    ],
    notes: "This is the actual reason for hand-wiring, not just 'because it's more advanced.' Fragile, loose connectors are a real source of mystery bugs, and a hand-wired board is also simply neater, which matters for today's competition framing."
  },
  {
    kind: "bullets",
    kicker: "On purpose",
    title: "Wire Color Rules",
    bullets: [
      "Red: 3V3 power, nothing else",
      "Green: ground (GND), always, in this room",
      "White: every GPIO signal wire"
    ],
    notes: "One consistent signal color keeps a board readable to a neighbor or a teacher checking it at a glance. Mixing colors for signal wires defeats the point; white is the only signal color in use today. Green for ground is a standing classroom convention, not just a suggestion for this unit."
  },
  {
    kind: "safety",
    kicker: "Check first",
    title: "Three Rails, Two Sides",
    bullets: [
      "Pin 36 (3V3 OUT): your power rail",
      "Pin 38 (GND): a separate main ground rail, same side as pin 36",
      "Pin 18 (GND): a spare ground rail, on the other side",
      "Only the power rail carries power today"
    ],
    notes: "Power and main ground are two separate rails that happen to sit on the same side of the board, not two sides of one rail, worth being precise about since it's an easy thing to mentally merge. The spare ground rail (pin 18) isn't needed yet, it's just wired and ready for later."
  },
  {
    kind: "image",
    kicker: "A trick that survives cutting",
    title: "Finding the Cathode",
    image: "/assets/img/pico/led-cathode-identification.svg",
    bullets: [
      "You'll trim each LED's legs short for neatness",
      "Leg length won't help you identify it anymore",
      "Look for the flat edge on the LED's case",
      "Or look through the dome: the bigger flag is the cathode"
    ],
    notes: "This is the key new skill for today. Have students check the flat edge and the internal flag against the longer leg BEFORE they cut anything, so they trust those two signs once every LED's legs are trimmed to match."
  },
  {
    kind: "bullets",
    kicker: "Today's build",
    title: "Three LEDs, One Circuit",
    bullets: [
      "Each LED: a resistor, then the LED, cathode toward the resistor",
      "Anode wire (white) to GP13, GP14, or GP15",
      "All three LEDs the same color: red",
      { text: "Check a resistor's value by its color bands", href: "/pico/03-physical-computing/#reading-resistor-colour-codes" }
    ],
    notes: "330 ohm resistors, or 220 if the LEDs look too dim. The last bullet links to Chapter 3's resistor color code guide, same as the lesson page, for anyone whose resistors aren't printed with a readable value."
  },
  {
    kind: "image",
    kicker: "Exemplar 1",
    title: "What You're Building",
    image: "/assets/img/pico/interlude-b-exemplar-1.jpg",
    bullets: [
      "Power and ground run to one rail",
      "Three LEDs, each with its own resistor",
      "Compare your board against this, and the one at the front of the room"
    ],
    notes: "Deliberately no pin numbers called out on the photo itself; point those out live against the real exemplar at the front of the room rather than trying to label a projected photo."
  },
  {
    kind: "bullets",
    kicker: "Get it checked",
    title: "Sign-Off: Two Stages",
    bullets: [
      "Neighbor check first",
      "Then a teacher check",
      "Compare carefully against the exemplar at the front of the room"
    ],
    notes: "Matches the two physical exemplars built ahead of time. Neighbor-then-teacher keeps the teacher from being the only bottleneck with limited class time and limited tools to go around."
  },
  {
    kind: "bullets",
    kicker: "Before you call a teacher over",
    title: "What Workmanship Counts",
    bullets: [
      "Wired correctly: right pins, right polarity, right color",
      "LEDs and resistors both trimmed short and neat",
      "Wires lie flat, not arched above the board",
      "Pico fully seated in the breadboard"
    ],
    notes: "This is the graded rubric baseline, not a scale for who tried hardest; it's printed in full on the graphic organizer. Going further than this is rewarded separately, through peer voting for extra credit, not through this grade.",
    down: [
      {
        kind: "bullets",
        kicker: "Full rubric, part 1",
        title: "Rubric: Wiring",
        bullets: [
          "Passed sign-off within the first or second check",
          "Power rail wired correctly (pin 36)",
          "Main ground rail wired correctly (pin 38)",
          "Spare ground rail wired correctly (pin 18)",
          "All 3 LEDs present and connected",
          "LEDs wired with correct polarity"
        ],
        notes: "First half of the rubric table printed on the graphic organizer, one point each."
      },
      {
        kind: "bullets",
        kicker: "Full rubric, part 2",
        title: "Rubric: Trim, Color, Seating",
        bullets: [
          "LEDs connected to the correct GPIO pins",
          "LED legs trimmed short and neat",
          "Resistor leads trimmed short and neat",
          "Wires lie flat: no more than 2mm above the breadboard",
          "Correct wire color used throughout (red, green, white)",
          "Pico fully and correctly seated in the breadboard"
        ],
        notes: "Second half, 12 points total. Exact match to the organizer; pull this up if a student wants the full list instead of flipping to their printed sheet."
      }
    ]
  },
  {
    kind: "title",
    title: "Questions?",
    subtitle: "Let's build.",
    notes: "Open the floor briefly, then get wire and cutters into hands."
  }
];

// A bullet is either a plain string, or { text, href } to render as a link
// (used for pointing straight at the chapter or the graphic organizer).
function renderBullets(bullets) {
  return (
    <ul>
      {bullets.map((b, i) => (
        <li key={i}>{typeof b === "string" ? b : <a href={b.href}>{b.text}</a>}</li>
      ))}
    </ul>
  );
}

function Stage({ slide, aspect }) {
  const arClass = aspect === "4:3" ? "ar-4-3" : "ar-16-9";
  if (slide.kind === "title") {
    return (
      <div className={"stage title-slide " + arClass}>
        {slide.kicker && <p className="kicker">{slide.kicker}</p>}
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
      </div>
    );
  }
  if (slide.kind === "image") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="slide-image-row">
          <img src={slide.image} alt="" />
          <div className="slide-body">{renderBullets(slide.bullets)}</div>
        </div>
      </div>
    );
  }
  if (slide.kind === "gallery") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="slide-gallery-row">
          {slide.images.map((im, i) => (
            <div className="slide-gallery-item" key={i}>
              <img src={im.src} alt="" />
              <p className="caption">{im.caption}</p>
            </div>
          ))}
        </div>
      </div>
    );
  }
  const extraClass = slide.kind === "safety" ? " safety-slide" : "";
  return (
    <div className={"stage " + arClass + extraClass}>
      <p className="kicker">{slide.kicker}</p>
      <h1 className="slide-title">{slide.title}</h1>
      <div className="slide-body">{renderBullets(slide.bullets)}</div>
    </div>
  );
}

function ScaledStage({ slide, aspect }) {
  const outerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const designW = 1280;
  const designH = aspect === "4:3" ? 960 : 720;

  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const recompute = () => {
      const rect = el.getBoundingClientRect();
      const s = Math.min((rect.width * 0.98) / designW, (rect.height * 0.98) / designH);
      setScale(s > 0 ? s : 1);
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener("resize", recompute);
    return () => { ro.disconnect(); window.removeEventListener("resize", recompute); };
  }, [designH]);

  return (
    <div className="stage-outer" ref={outerRef}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center" }}>
        <Stage slide={slide} aspect={aspect} />
      </div>
    </div>
  );
}

function bulletsToText(bullets) {
  return bullets.map(b => (typeof b === "string" ? b : b.text)).join(" / ");
}

function OutlineCard({ slide, heading, nested }) {
  return (
    <div className={"outline-slide" + (nested ? " outline-nested" : "")}>
      {nested ? <h3>{heading}</h3> : <h2>{heading}</h2>}
      {slide.bullets && <p className="outline-bullets">On slide: {bulletsToText(slide.bullets)}</p>}
      {slide.images && <p className="outline-bullets">Photos: {slide.images.map(im => im.caption).join(" / ")}</p>}
      <div className="outline-notes"><p>{slide.notes}</p></div>
    </div>
  );
}

function Outline() {
  return (
    <div className="outline">
      <h1>Project 1.1: Wiring Three LEDs</h1>
      <p className="outline-sub">Speaker notes outline. Print this before class if you'd rather have paper than toggle notes on screen. Indented cards are optional "down arrow" detail, skipped by the normal next/prev flow.</p>
      {SLIDES.map((s, i) => (
        <React.Fragment key={i}>
          <OutlineCard slide={s} heading={`${i + 1}. ${s.title}`} />
          {(s.down || []).map((d, j) => (
            <OutlineCard slide={d} heading={`Extra: ${d.title}`} nested key={j} />
          ))}
        </React.Fragment>
      ))}
    </div>
  );
}

// Deep-linking: ?slide=3 opens on that slide (1-indexed, to match the
// on-screen counter), ?extra=1 additionally drops into that slide's Nth
// "down" slide if it has any, ?outline=1 opens straight into the
// speaker-notes outline -- handy for linking straight to a specific slide,
// or handing a substitute teacher the notes view without them finding the
// button.
function initialStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const slideParam = parseInt(params.get("slide"), 10);
  const index = Number.isInteger(slideParam) ? Math.min(Math.max(slideParam - 1, 0), SLIDES.length - 1) : 0;
  const maxExtra = (SLIDES[index].down || []).length;
  const extraParam = parseInt(params.get("extra"), 10);
  const subIndex = Number.isInteger(extraParam) ? Math.min(Math.max(extraParam, 0), maxExtra) : 0;
  const mode = params.get("outline") ? "outline" : "deck";
  return { index, subIndex, mode };
}

function App() {
  const initial = initialStateFromUrl();
  const [index, setIndex] = useState(initial.index);
  const [subIndex, setSubIndex] = useState(initial.subIndex);
  const [showNotes, setShowNotes] = useState(false);
  const [aspect, setAspect] = useState("16:9");
  const [mode, setMode] = useState(initial.mode); // "deck" | "outline"

  const topSlide = SLIDES[index];
  const downSlides = topSlide.down || [];
  const slide = subIndex === 0 ? topSlide : downSlides[subIndex - 1];

  const next = useCallback(() => { setIndex(i => Math.min(i + 1, SLIDES.length - 1)); setSubIndex(0); }, []);
  const prev = useCallback(() => { setIndex(i => Math.max(i - 1, 0)); setSubIndex(0); }, []);
  const goDown = useCallback(() => setSubIndex(s => Math.min(s + 1, downSlides.length)), [downSlides.length]);
  const goUp = useCallback(() => setSubIndex(s => Math.max(s - 1, 0)), []);

  useEffect(() => {
    function onKey(e) {
      if (mode !== "deck") {
        if (e.key === "Escape") setMode("deck");
        return;
      }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); goDown(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); goUp(); }
      else if (e.key === "n" || e.key === "N") setShowNotes(v => !v);
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "o" || e.key === "O") setMode("outline");
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [mode, next, prev, goDown, goUp]);

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  if (mode === "outline") {
    return (
      <div className="app">
        <div className="toolbar">
          <a className="back-link" href="/pico/project1-1-wiring-three-leds/">&larr; Project 1.1</a>
          <div className="spacer"></div>
          <button onClick={() => setMode("deck")}>Back to slides (Esc)</button>
          <button onClick={() => window.print()}>Print</button>
        </div>
        <Outline />
      </div>
    );
  }

  return (
    <div className="app">
      <div className="stage-outer" style={{ position: "relative" }}>
        <ScaledStage slide={slide} aspect={aspect} />
        <div className="click-zone left" onClick={prev} title="Previous slide"></div>
        <div className="click-zone right" onClick={next} title="Next slide"></div>
        {subIndex > 0 && (
          <button className="depth-nav depth-up" onClick={goUp} title="Back to the main flow">&#9650; Back</button>
        )}
        {subIndex < downSlides.length && (
          <button className="depth-nav depth-down" onClick={goDown} title="More about this slide">&#9660; More</button>
        )}
        <div className="slide-counter-badge">
          {index + 1} / {SLIDES.length}
          {subIndex > 0 && <span> &middot; extra {subIndex}/{downSlides.length}</span>}
        </div>
      </div>
      {showNotes && (
        <div className="notes-panel">
          <h3>Speaker notes</h3>
          <p>{slide.notes}</p>
        </div>
      )}
      <div className="toolbar">
        <a className="back-link" href="/pico/project1-1-wiring-three-leds/">&larr; Project 1.1</a>
        <div className="spacer"></div>
        <button onClick={prev} disabled={index === 0}>&larr; Prev</button>
        <span className="counter">{index + 1} / {SLIDES.length}</span>
        <button onClick={next} disabled={index === SLIDES.length - 1}>Next &rarr;</button>
        <button className={showNotes ? "active" : ""} onClick={() => setShowNotes(v => !v)}>Notes (N)</button>
        <button onClick={() => setMode("outline")}>Print notes (O)</button>
        <button onClick={() => setAspect(a => a === "16:9" ? "4:3" : "16:9")}>{aspect}</button>
        <button onClick={toggleFullscreen}>Fullscreen (F)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>
</body>
</html>
