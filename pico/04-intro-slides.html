<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chapter 4: Physical Computing with Raspberry Pi Pico -- Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/assets/img/pico/favicon.svg">
<style>
  :root {
    --accent: #2a7ae2;
    --ink: #1b1f23;
    --paper: #ffffff;
    --muted: #57606a;
    --border: #d0d7de;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #e9edf1;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #root { height: 100%; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .stage-outer {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }

  /* Fixed-size design canvas, scaled to fit via a JS-computed transform --
     lets every slide be authored at generous, fixed pixel sizes ("bigger
     type") without hand-tuning responsive font sizes per breakpoint. */
  .stage {
    width: 1280px;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.18);
    padding: 80px 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 0 0 auto;
  }

  .stage.ar-16-9 { height: 720px; }
  .stage.ar-4-3 { height: 960px; }

  .kicker {
    font-size: 28px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  .slide-title {
    font-size: 64px;
    line-height: 1.1;
    margin: 0 0 40px;
    font-weight: 700;
  }

  .slide-body {
    font-size: 36px;
    line-height: 1.5;
  }

  .slide-body ul {
    margin: 0;
    padding-left: 1.1em;
  }

  .slide-body li {
    margin-bottom: 22px;
  }

  .slide-body li:last-child { margin-bottom: 0; }

  .slide-image-row {
    display: flex;
    gap: 40px;
    align-items: center;
    margin-top: 20px;
  }

  .slide-image-row img {
    max-height: 260px;
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .slide-image-row .slide-body {
    flex: 1 1 auto;
    font-size: 30px;
  }

  .slide-image-row .slide-body li {
    margin-bottom: 16px;
  }

  .slide-body a, .slide-image-row .slide-body a {
    color: var(--accent);
  }

  .slide-gallery-row {
    display: flex;
    gap: 30px;
    margin-top: 20px;
    align-items: flex-start;
  }

  .slide-gallery-item {
    flex: 1 1 0;
    text-align: center;
  }

  .slide-gallery-item img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .slide-gallery-item .caption {
    margin-top: 14px;
    font-size: 22px;
    line-height: 1.3;
  }

  .depth-nav {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 14px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    z-index: 3;
  }

  .depth-nav.depth-up {
    bottom: auto;
    top: 14px;
  }

  .depth-nav:hover {
    background: rgba(0,0,0,0.75);
  }

  .title-slide {
    text-align: left;
    justify-content: center;
  }

  .title-slide .slide-title {
    font-size: 76px;
    margin-bottom: 16px;
  }

  .title-slide .slide-subtitle {
    font-size: 34px;
    color: var(--muted);
  }

  .safety-slide {
    background: #fff7e6;
  }

  .safety-slide .kicker {
    color: #b25e00;
  }

  .slide-counter-badge {
    position: absolute;
    bottom: 18px;
    right: 24px;
    font-size: 15px;
    color: var(--muted);
  }

  /* --- Toolbar (not part of the scaled stage, so it stays a readable,
     fixed size regardless of projector distance / zoom level) --- */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #1b1f23;
    color: #fff;
    font-size: 14px;
    flex-wrap: wrap;
  }

  .toolbar button {
    background: #333a42;
    color: #fff;
    border: 1px solid #4a545e;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }

  .toolbar button:hover { background: #444e58; }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }

  .toolbar .spacer { flex: 1 1 auto; }
  .toolbar .counter { min-width: 4.5em; text-align: center; }
  .toolbar a.back-link { color: #9db8e8; text-decoration: none; font-size: 14px; }
  .toolbar a.back-link:hover { text-decoration: underline; }

  /* --- Speaker notes panel: docked below the stage, plain readable text,
     hidden by default so a mirrored/projected display shows a clean deck. --- */
  .notes-panel {
    flex: 0 0 auto;
    background: #f6f8fa;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    max-height: 26vh;
    overflow-y: auto;
    font-size: 17px;
    line-height: 1.5;
  }

  .notes-panel h3 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    cursor: pointer;
  }
  .click-zone.left { left: 0; }
  .click-zone.right { right: 0; }

  /* --- Outline / print-notes view: a plain scrollable page listing every
     slide with its full speaker notes, meant for printing ahead of class. --- */
  .outline {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    overflow-y: auto;
    height: 100%;
  }

  .outline h1 { margin-bottom: 4px; }
  .outline .outline-sub { color: var(--muted); margin-top: 0; }

  .outline-slide {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin: 20px 0;
    break-inside: avoid;
  }

  .outline-slide h2 {
    margin: 0 0 8px;
    font-size: 22px;
  }

  .outline-slide.outline-nested {
    margin: 12px 0 12px 32px;
    background: #f6f8fa;
    border-style: dashed;
  }

  .outline-slide h3 {
    margin: 0 0 6px;
    font-size: 18px;
    color: var(--muted);
  }

  .outline-slide .outline-bullets {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 14px;
  }

  .outline-slide .outline-notes {
    font-size: 16px;
    line-height: 1.5;
  }

  .outline-slide .outline-notes p:first-child { margin-top: 0; }

  @media print {
    .toolbar { display: none !important; }
    .outline { height: auto; overflow: visible; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module">
{% raw %}
const { useState, useEffect, useRef, useCallback } = React;

// Edit this array to change the deck. `bullets` is what students see on the
// slide (keep it short, they're reading fast); `notes` is only ever shown in
// the notes panel or the printable outline, so it can be a full paragraph.
// A bullet can be a plain string, or { text, href } to render as a link.
// A top-level slide can carry a `down` array of extra slides reachable with
// the down arrow / "More" button -- optional detail (more pictures, a deeper
// dive) that the fast path (left/right, space) skips right over.
//
// Chapter 4 is a long, hands-on chapter (onboard LED, breadboards, an
// external LED, then a button). Today's class is specifically about
// breadboards, LEDs, and resistors, so this deck moves fast through the
// onboard-LED recap and only teases the button section at the end, rather
// than giving every section equal weight.
const SLIDES = [
  {
    kind: "title",
    kicker: "Chapter 4",
    title: "Physical Computing with Pico",
    subtitle: "Today: your first real circuit, a breadboard, an LED, and a resistor",
    notes: "Chapter 3 was all vocabulary and concepts; today is the hands-on payoff. The chapter actually covers four things: the onboard LED, breadboards, an external LED circuit, and reading a button. This class period is scoped to the first three -- breadboards, LEDs, and resistors -- so move quickly through the onboard-LED recap and save real time for the external LED build. The button section gets teased at the end, not taught today."
  },
  {
    kind: "image",
    kicker: "Quick recap",
    title: "Hello, LED!",
    image: "/assets/img/pico/fig-4-1.jpg",
    bullets: [
      "machine.Pin() turns a GPIO pin into something you control",
      ".value(1) and .value(0) turn it on and off",
      ".toggle() flips whatever state it's already in",
      "The onboard LED has no pin number: you use the string \"LED\""
    ],
    notes: "This is reading they may have already done, or can do as homework: the onboard LED, to the left of the micro USB port. Don't dwell here. The point of this slide is just to get the vocabulary (Pin, value, toggle) active in their heads before they touch a breadboard, since the external LED code is identical except for the pin number."
  },
  {
    kind: "safety",
    kicker: "Before you touch a breadboard",
    title: "Three Rules",
    bullets: [
      "Unplug your Pico from USB before you wire anything",
      "Never let two pins touch directly: that's a short circuit",
      "Be gentle with the header pins when seating your Pico"
    ],
    notes: "Worth saying out loud before anyone picks up a breadboard. A short circuit between the wrong two pins can permanently damage the Pico, and bent header pins are hard to fix once it happens. This is the same warning the chapter gives right before the breadboard section."
  },
  {
    kind: "image",
    kicker: "New tool",
    title: "Meet the Breadboard",
    image: "/assets/img/pico/fig-4-2.png",
    bullets: [
      "Holes in the same numbered column are secretly connected",
      "No soldering: just push components into the holes",
      "Power rails along the top and bottom give every component a common ground"
    ],
    notes: "The key idea is the hidden metal strips: A1 and B1 are connected to each other, but A1 and A2 are not, unless you add a jumper wire. The power rails are the exception, running the full length of the board instead of in short columns. This is genuinely confusing the first time; expect questions."
  },
  {
    kind: "image",
    kicker: "Step one",
    title: "Seating Your Pico",
    image: "/assets/img/pico/fig-4-3.jpg",
    bullets: [
      "Straddle the middle gap of the breadboard",
      "Micro USB port faces the edge of the board",
      "Push down gently until the header pins are fully seated"
    ],
    notes: "Straddling the gap matters: it means the left and right rows of pins land in electrically separate halves of the board, which is what lets you wire to either side independently. Watch for students forcing it in crooked, which is how pins get bent."
  },
  {
    kind: "bullets",
    kicker: "Today's build",
    title: "Wiring an External LED",
    bullets: [
      "You'll need: a breadboard, M2M jumper wires, an LED, and a 330 Ω resistor",
      "The longer leg of the LED is the anode (positive)",
      "The shorter leg is the cathode (negative)"
    ],
    notes: "This is the main event for today. Have components distributed before this slide if possible so students can hold the LED while you talk about anode vs. cathode -- it's much easier to see the leg-length difference in hand than in a photo."
  },
  {
    kind: "bullets",
    kicker: "Why it matters",
    title: "Resistance Is Vital",
    bullets: [
      "The resistor limits how much current the LED can draw",
      "Without it, the LED (or even the Pico) can burn out",
      "330 Ω works for most common LEDs",
      "Higher value = dimmer; lower value = brighter"
    ],
    notes: "This is the chapter's own 'Resistance Is Vital' callout. Worth emphasizing as a rule, not just a suggestion: never connect an LED straight to a GPIO pin without a current-limiting resistor in the path, unless the LED has one built in."
  },
  {
    kind: "image",
    kicker: "The finished circuit",
    title: "Anode In, Cathode Out",
    image: "/assets/img/pico/fig-4-4.png",
    bullets: [
      "GPIO pin → resistor → anode → LED → cathode → ground",
      "Same code as the onboard LED, just a different pin number",
      "Rename the variable too: led_external, not led_onboard"
    ],
    notes: "This is the order of connections students should be able to trace with a finger: pin, through the resistor, into the anode, through the LED, out the cathode, to ground. That's exactly what the Notes page's draw-a-circuit question asks them to label. The code change from the onboard LED version is genuinely just the pin number and a variable rename -- worth pointing out how little changed, since it reinforces that the GPIO API works the same way regardless of what's on the other end of the wire.",
    down: [
      {
        kind: "bullets",
        kicker: "If you finish early",
        title: "Push Further",
        bullets: [
          "Can you light the onboard LED and the external LED at once?",
          "Can you make one turn on exactly when the other turns off?",
          "Every extra LED needs its own current-limiting resistor"
        ],
        notes: "This is the chapter's own 'Multiple LEDs' challenge, for anyone who finishes wiring and testing early. Not required."
      }
    ]
  },
  {
    kind: "bullets",
    kicker: "Next time",
    title: "Coming Up: Reading a Button",
    bullets: [
      "Today was outputs: making something happen",
      "Next: inputs; reading whether a button is pressed",
      "Same breadboard, one more component"
    ],
    notes: "Deliberately a tease, not a lesson. The button section introduces pull-up resistors and is its own chunk of new vocabulary, so it's getting its own class period rather than being rushed in after the LED build."
  },
  {
    kind: "bullets",
    kicker: "Plan",
    title: "Today's Plan",
    bullets: [
      { text: "Read through \"Using a breadboard\" and \"Next steps: an external LED\"", href: "/pico/04-physical-computing-with-pico/" },
      { text: "Wire your LED circuit and get it blinking", href: "/pico/04-physical-computing-with-pico/" },
      { text: "Fill out Parts 1 through 3 of the Notes page", href: "/pico/04-graphic-organizer/" }
    ],
    notes: "Parts 1 through 3 of the organizer match today's scope (onboard LED recap, breadboards, external LED). Part 4, on reading a button, can wait until that lesson happens."
  },
  {
    kind: "title",
    title: "Questions?",
    subtitle: "Let's build.",
    notes: "Open the floor briefly, then get components into hands."
  }
];

// A bullet is either a plain string, or { text, href } to render as a link
// (used for pointing straight at the chapter or the Notes page).
function renderBullets(bullets) {
  return (
    <ul>
      {bullets.map((b, i) => (
        <li key={i}>{typeof b === "string" ? b : <a href={b.href}>{b.text}</a>}</li>
      ))}
    </ul>
  );
}

function Stage({ slide, aspect }) {
  const arClass = aspect === "4:3" ? "ar-4-3" : "ar-16-9";
  if (slide.kind === "title") {
    return (
      <div className={"stage title-slide " + arClass}>
        {slide.kicker && <p className="kicker">{slide.kicker}</p>}
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
      </div>
    );
  }
  if (slide.kind === "image") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="slide-image-row">
          <img src={slide.image} alt="" />
          <div className="slide-body">{renderBullets(slide.bullets)}</div>
        </div>
      </div>
    );
  }
  if (slide.kind === "gallery") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="slide-gallery-row">
          {slide.images.map((im, i) => (
            <div className="slide-gallery-item" key={i}>
              <img src={im.src} alt="" />
              <p className="caption">{im.caption}</p>
            </div>
          ))}
        </div>
      </div>
    );
  }
  const extraClass = slide.kind === "safety" ? " safety-slide" : "";
  return (
    <div className={"stage " + arClass + extraClass}>
      <p className="kicker">{slide.kicker}</p>
      <h1 className="slide-title">{slide.title}</h1>
      <div className="slide-body">{renderBullets(slide.bullets)}</div>
    </div>
  );
}

function ScaledStage({ slide, aspect }) {
  const outerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const designW = 1280;
  const designH = aspect === "4:3" ? 960 : 720;

  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const recompute = () => {
      const rect = el.getBoundingClientRect();
      const s = Math.min((rect.width * 0.98) / designW, (rect.height * 0.98) / designH);
      setScale(s > 0 ? s : 1);
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener("resize", recompute);
    return () => { ro.disconnect(); window.removeEventListener("resize", recompute); };
  }, [designH]);

  return (
    <div className="stage-outer" ref={outerRef}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center" }}>
        <Stage slide={slide} aspect={aspect} />
      </div>
    </div>
  );
}

function bulletsToText(bullets) {
  return bullets.map(b => (typeof b === "string" ? b : b.text)).join(" / ");
}

function OutlineCard({ slide, heading, nested }) {
  return (
    <div className={"outline-slide" + (nested ? " outline-nested" : "")}>
      {nested ? <h3>{heading}</h3> : <h2>{heading}</h2>}
      {slide.bullets && <p className="outline-bullets">On slide: {bulletsToText(slide.bullets)}</p>}
      {slide.images && <p className="outline-bullets">Photos: {slide.images.map(im => im.caption).join(" / ")}</p>}
      <div className="outline-notes"><p>{slide.notes}</p></div>
    </div>
  );
}

function Outline() {
  return (
    <div className="outline">
      <h1>Chapter 4: Physical Computing with Pico</h1>
      <p className="outline-sub">Speaker notes outline. Print this before class if you'd rather have paper than toggle notes on screen. Indented cards are optional "down arrow" detail, skipped by the normal next/prev flow.</p>
      {SLIDES.map((s, i) => (
        <React.Fragment key={i}>
          <OutlineCard slide={s} heading={`${i + 1}. ${s.title}`} />
          {(s.down || []).map((d, j) => (
            <OutlineCard slide={d} heading={`Extra: ${d.title}`} nested key={j} />
          ))}
        </React.Fragment>
      ))}
    </div>
  );
}

// Deep-linking: ?slide=3 opens on that slide (1-indexed, to match the
// on-screen counter), ?extra=1 additionally drops into that slide's Nth
// "down" slide if it has any, ?outline=1 opens straight into the
// speaker-notes outline -- handy for linking straight to a specific slide,
// or handing a substitute teacher the notes view without them finding the
// button.
function initialStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const slideParam = parseInt(params.get("slide"), 10);
  const index = Number.isInteger(slideParam) ? Math.min(Math.max(slideParam - 1, 0), SLIDES.length - 1) : 0;
  const maxExtra = (SLIDES[index].down || []).length;
  const extraParam = parseInt(params.get("extra"), 10);
  const subIndex = Number.isInteger(extraParam) ? Math.min(Math.max(extraParam, 0), maxExtra) : 0;
  const mode = params.get("outline") ? "outline" : "deck";
  return { index, subIndex, mode };
}

function App() {
  const initial = initialStateFromUrl();
  const [index, setIndex] = useState(initial.index);
  const [subIndex, setSubIndex] = useState(initial.subIndex);
  const [showNotes, setShowNotes] = useState(false);
  const [aspect, setAspect] = useState("16:9");
  const [mode, setMode] = useState(initial.mode); // "deck" | "outline"

  const topSlide = SLIDES[index];
  const downSlides = topSlide.down || [];
  const slide = subIndex === 0 ? topSlide : downSlides[subIndex - 1];

  const next = useCallback(() => { setIndex(i => Math.min(i + 1, SLIDES.length - 1)); setSubIndex(0); }, []);
  const prev = useCallback(() => { setIndex(i => Math.max(i - 1, 0)); setSubIndex(0); }, []);
  const goDown = useCallback(() => setSubIndex(s => Math.min(s + 1, downSlides.length)), [downSlides.length]);
  const goUp = useCallback(() => setSubIndex(s => Math.max(s - 1, 0)), []);

  useEffect(() => {
    function onKey(e) {
      if (mode !== "deck") {
        if (e.key === "Escape") setMode("deck");
        return;
      }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); goDown(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); goUp(); }
      else if (e.key === "n" || e.key === "N") setShowNotes(v => !v);
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "o" || e.key === "O") setMode("outline");
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [mode, next, prev, goDown, goUp]);

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  if (mode === "outline") {
    return (
      <div className="app">
        <div className="toolbar">
          <a className="back-link" href="/pico/04-physical-computing-with-pico/">&larr; Chapter 4</a>
          <div className="spacer"></div>
          <button onClick={() => setMode("deck")}>Back to slides (Esc)</button>
          <button onClick={() => window.print()}>Print</button>
        </div>
        <Outline />
      </div>
    );
  }

  return (
    <div className="app">
      <div className="stage-outer" style={{ position: "relative" }}>
        <ScaledStage slide={slide} aspect={aspect} />
        <div className="click-zone left" onClick={prev} title="Previous slide"></div>
        <div className="click-zone right" onClick={next} title="Next slide"></div>
        {subIndex > 0 && (
          <button className="depth-nav depth-up" onClick={goUp} title="Back to the main flow">&#9650; Back</button>
        )}
        {subIndex < downSlides.length && (
          <button className="depth-nav depth-down" onClick={goDown} title="More about this slide">&#9660; More</button>
        )}
        <div className="slide-counter-badge">
          {index + 1} / {SLIDES.length}
          {subIndex > 0 && <span> &middot; extra {subIndex}/{downSlides.length}</span>}
        </div>
      </div>
      {showNotes && (
        <div className="notes-panel">
          <h3>Speaker notes</h3>
          <p>{slide.notes}</p>
        </div>
      )}
      <div className="toolbar">
        <a className="back-link" href="/pico/04-physical-computing-with-pico/">&larr; Chapter 4</a>
        <div className="spacer"></div>
        <button onClick={prev} disabled={index === 0}>&larr; Prev</button>
        <span className="counter">{index + 1} / {SLIDES.length}</span>
        <button onClick={next} disabled={index === SLIDES.length - 1}>Next &rarr;</button>
        <button className={showNotes ? "active" : ""} onClick={() => setShowNotes(v => !v)}>Notes (N)</button>
        <button onClick={() => setMode("outline")}>Print notes (O)</button>
        <button onClick={() => setAspect(a => a === "16:9" ? "4:3" : "16:9")}>{aspect}</button>
        <button onClick={toggleFullscreen}>Fullscreen (F)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>
</body>
</html>
