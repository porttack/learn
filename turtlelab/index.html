<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Content Security Policy: the page may only load files from its own
    folder (plus data: and blob: images, which saving a picture needs).
    No outside scripts, styles, fonts, images or network calls are allowed,
    and there is no inline script or style anywhere.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurtleLab</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/site-menu.css">
</head>
<body>
  <header class="toolbar">
    <h1 id="app-name">TurtleLab</h1>
    <button id="run" class="icon-button" type="button" title="Run" aria-label="Run">
      <img src="images/run-button.svg" alt="" draggable="false">
    </button>
    <button id="stop" class="icon-button" type="button" title="Stop" aria-label="Stop">
      <img src="images/stop-button.svg" alt="" draggable="false">
    </button>
    <span class="toolbar-gap" aria-hidden="true"></span>
    <button id="new" class="icon-button" type="button" title="New: start over (Undo brings your blocks back)" aria-label="New">
      <img src="images/new-button.svg" alt="" draggable="false">
    </button>
    <button id="open" class="icon-button" type="button" title="Open a saved picture" aria-label="Open">
      <img src="images/open-button.svg" alt="" draggable="false">
    </button>
    <button id="save" class="icon-button" type="button" title="Save a picture with your blocks inside (Ctrl+S)" aria-label="Save">
      <img src="images/save-button.svg" alt="" draggable="false">
    </button>
    <input id="open-file" type="file" accept=".png,image/png,.json,application/json" hidden>
    <span class="toolbar-gap" aria-hidden="true"></span>
    <button id="undo" class="icon-button" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
      <img src="images/undo.svg" alt="" draggable="false">
    </button>
    <button id="redo" class="icon-button" type="button" title="Redo (Ctrl+Y)" aria-label="Redo">
      <img src="images/redo.svg" alt="" draggable="false">
    </button>
    <span class="toolbar-gap" aria-hidden="true"></span>
    <button id="zoom-out" class="icon-button" type="button" title="Make blocks smaller" aria-label="Zoom out">
      <img src="images/smaller-button.svg" alt="" draggable="false">
    </button>
    <button id="zoom-in" class="icon-button" type="button" title="Make blocks bigger" aria-label="Zoom in">
      <img src="images/bigger-button.svg" alt="" draggable="false">
    </button>
    <button id="view-home" class="icon-button" type="button" title="Back to the starting view" aria-label="Reset view">
      <img src="images/go-home-button.svg" alt="" draggable="false">
    </button>
    <button id="hide-blocks" class="icon-button" type="button" title="Hide blocks" aria-label="Hide or show blocks" aria-pressed="false">
      <img src="images/hide-blocks-button.svg" alt="" draggable="false">
    </button>
    <!-- These open in a new tab, so a click never takes you away from your blocks. -->
    <a class="toolbar-link" href="samples.html" target="_blank" rel="noopener">Samples</a>
    <a class="toolbar-link" href="guide.html" target="_blank" rel="noopener">Guide</a>
    <a class="toolbar-link" href="about.html" target="_blank" rel="noopener">About</a>
    <!-- The same list as the rest of the site's menu (a test keeps them in step). New tab, so you keep your drawing. -->
    <div class="site-menu">
      <input type="checkbox" id="site-menu-trigger" class="site-menu-trigger">
      <label for="site-menu-trigger" class="site-menu-icon" aria-label="Site menu" title="The rest of the site">&#9776;</label>
      <label for="site-menu-trigger" class="site-menu-backdrop" aria-hidden="true"></label>
      <nav class="site-menu-panel" aria-label="Site menu">
        <a href="/" target="_blank" rel="noopener">Home (learn.porttack.com)</a>
        <a href="/pico/" target="_blank" rel="noopener">MicroPython on Pi Pico and Projects</a>
        <a href="/electronics101/" target="_blank" rel="noopener">Electronics 101</a>
        <a href="/working-in-python/" target="_blank" rel="noopener">Working in Python</a>
        <a href="/python3d/" target="_blank" rel="noopener">Python in 3D</a>
        <a href="/turtlelab/" target="_blank" rel="noopener">TurtleLab</a>
        <a href="/cs50-psets/" target="_blank" rel="noopener">CS50 Problems</a>
        <a href="/unplugged/" target="_blank" rel="noopener">CS Unplugged</a>
        <a href="/standards/" target="_blank" rel="noopener">Standards</a>
      </nav>
    </div>
  </header>
  <main id="stage" class="stage"></main>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <script type="module" src="js/ui/main.js"></script>
</body>
</html>
