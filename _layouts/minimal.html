<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {% if page.bare_home_link %}
    <div class="site-topbar">
      <div class="wrapper">
        <a href="{{ "/" | relative_url }}" class="home-link">&larr; Home</a>
      </div>
    </div>
    {% endif %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

  </body>

</html>
