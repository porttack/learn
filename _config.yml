title: "Port Tack Learning"
description: >-
  Learning pathways in computer science and robotics for middle and
  high school students.
url: "https://learn.porttack.com"
baseurl: ""
author: "Eric Brown"
author_url: "https://porttack.com"

theme: minima
minima:
  skin: classic

# One collection per learning pathway. Add new pathways here and in
# _data/pathways.yml at the same time.
collections:
  pico:
    output: true
    permalink: /pico/:name/
  electronics101:
    output: true
    permalink: /electronics101/:name/
  rovrobotics:
    output: true
    permalink: /rovrobotics/:name/
  cs50psets:
    output: true
    permalink: /cs50-psets/:name/

defaults:
  - scope: { path: "", type: "pico" }
    values:
      layout: lesson
      pathway: pico
  - scope: { path: "", type: "electronics101" }
    values:
      layout: lesson
      pathway: electronics101
  - scope: { path: "", type: "rovrobotics" }
    values:
      layout: lesson
      pathway: rovrobotics
  - scope: { path: "", type: "cs50psets" }
    values:
      layout: lesson
      pathway: cs50psets

header_pages:
  - index.md
  - license.md

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - tools/
  - source/
  - vendor/
  - working-in-python/CNAME

# working-in-python is a submodule holding a pre-built Sphinx site (not
# Jekyll source). Its underscore-prefixed asset dirs would otherwise be
# silently dropped by Jekyll's default exclusion of "_"-prefixed paths.
# Jekyll's include matching for nested dirs works by basename only, not
# by full path, so these must be listed bare (no "working-in-python/" prefix).
#
# working-in-python's 2026-08-16 naming cleanup dropped its old ___/__/_
# prefix scheme for chapter/exercises notebooks (now plain
# "ChapterNN-<Title>[-exercises].ipynb", Title Case, not underscore-prefixed,
# so Jekyll includes them by default -- no entry needed here anymore). The
# "teach"/"blank" classroom-projection copy went through two more renames the
# same day before working-in-python decided to stop shipping it into the
# JupyterLite build at all for now (its own AUDIT.md, 2026-08-16, has the
# full back-and-forth) -- nothing to include here for it either way, since it
# doesn't exist in that submodule right now. The temporary chapter 2/3 alias
# entries this comment used to describe were removed 2026-09-14, once
# working-in-python's own ALIASES dict dropped them (confirmed empty as of
# that repo's 2026-09-13 interlude-rename work). Only one kind of
# underscore-prefixed .ipynb still exists there: the two front-matter
# notebooks, also Title Case now ("_Start-Here.ipynb", "_Using-Notebooks.ipynb").
include:
  - _static
  - _sources
  - _sphinx_design_static
  - "_Start-Here.ipynb"
  - "_Using-Notebooks.ipynb"
