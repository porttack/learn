<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Standards Coverage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #ffffff; --fg: #1b1f23; --muted: #57606a; --border: #d0d7de;
  --accent: #0969da; --code-bg: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
    --accent: #4493f8; --code-bg: #161b22; }
}
:root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
  --accent: #4493f8; --code-bg: #161b22; }
:root[data-theme="light"] { --bg: #ffffff; --fg: #1b1f23; --muted: #57606a; --border: #d0d7de;
  --accent: #0969da; --code-bg: #f6f8fa; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.layout { display: flex; align-items: flex-start; }
aside#source-picker {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; flex: 0 0 260px;
  padding: 1rem; border-right: 1px solid var(--border); font-size: 0.85rem;
}
aside#source-picker h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 .6rem; }
/* ">" (direct child), not a descendant combinator -- #source-list nests its
   own <details class="source-group"> summaries inside this one, and a plain
   descendant selector here would also match those, always winning over their
   own rules below since an ID beats a class on specificity regardless of
   which one's condition (like [open]) actually fits that nested element. */
#source-details > summary {
  font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  cursor: pointer; list-style: none; margin: 0 0 .6rem;
}
#source-details > summary::-webkit-details-marker { display: none; }
#source-details > summary::before {
  content: "▸"; display: inline-block; width: 1em; font-size: 1.3rem; line-height: 1;
  vertical-align: -.15em;
}
#source-details[open] > summary::before { content: "▾"; }
.source-picker-actions { margin: 0 0 .6rem; font-size: .8rem; }
.source-picker-actions button {
  background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline;
  font: inherit; cursor: pointer;
}
.source-picker-actions button:hover { color: var(--fg); }
.source-picker-actions .sep { color: var(--muted); margin: 0 .4em; }
.source-group { margin: 0 0 .4rem; }
.source-group summary {
  font-weight: 600; cursor: pointer; list-style: none; margin: 0 0 .2rem;
}
.source-group summary::-webkit-details-marker { display: none; }
.source-group summary::before {
  content: "▸"; display: inline-block; width: 1em; color: var(--muted); font-size: 1.3rem; line-height: 1;
  vertical-align: -.15em;
}
.source-group[open] summary::before { content: "▾"; }
.source-row { display: flex; align-items: center; gap: .55rem; padding: .3rem 0; cursor: pointer; }
/* The checkbox doubles as the legend swatch -- its own source color, hollow
   when unchecked (a colored outline, so identity still reads even when
   toggled off) and solid-filled with a checkmark when checked.
   --swatch-color is set inline per-checkbox from the same --hue-<slug>
   variable the bars use. The checkmark is white with mix-blend-mode:
   difference rather than a fixed ink color -- a single fixed color can't
   contrast reliably against all 8 hues (light yellow and dark violet fills
   need opposite ink), but difference-blended white always renders as
   whatever color is visually farthest from what's underneath it. */
.source-row input[type="checkbox"].source-checkbox {
  appearance: none; -webkit-appearance: none;
  flex: 0 0 auto; width: 17px; height: 17px; margin: 0; border-radius: 5px;
  border: 2px solid var(--swatch-color); background: transparent;
  cursor: pointer; position: relative;
}
.source-row input[type="checkbox"].source-checkbox:hover { filter: brightness(1.15); }
.source-row input[type="checkbox"].source-checkbox:focus-visible {
  outline: 2px solid var(--fg); outline-offset: 2px;
}
.source-row input[type="checkbox"].source-checkbox:checked::after {
  content: ""; position: absolute; left: 4px; top: 0px; width: 5px; height: 9px;
  border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
  mix-blend-mode: difference;
}
.source-row input[type="checkbox"].source-checkbox:checked { background: var(--swatch-color); }
.source-row .source-title { flex: 1 1 auto; }
a.source-title.source-link { color: var(--accent); text-decoration: underline; }
a.source-title.source-link:hover { text-decoration-thickness: 2px; }
a.source-only-link, a.source-report-link {
  flex: 0 0 auto; font-size: .78em; color: var(--muted); text-decoration: none;
  border: 1px solid var(--border); border-radius: 5px; padding: .05em .4em;
}
a.source-only-link:hover, a.source-only-link:focus-visible,
a.source-report-link:hover, a.source-report-link:focus-visible { color: var(--fg); border-color: var(--muted); }

/* ---------- Focus mode (?only=<source-slug-or-abbrev>): highlights one
   source's coverage across the full catalog -- nothing hidden by default,
   see applyOnlyParam() in standards-coverage.js. The banner's own checkbox
   is the opt-in for the narrower "hide what it doesn't cover" view. ---------- */
#only-banner {
  background: color-mix(in oklch, var(--accent) 12%, var(--bg));
  border: 1px solid var(--accent); border-radius: 8px;
  padding: .6em .9em; margin: 0 0 1rem; font-size: .92rem;
}
#only-banner a { color: var(--accent); font-weight: 600; }
.only-hide-toggle { margin-left: .3em; font-weight: normal; color: var(--fg); white-space: nowrap; }
.only-hide-toggle input { margin-right: .3em; }
body.cov-only-hide .cov-badge:not(.has-coverage) { display: none; }
body.cov-only-hide .cov-panel:not(:has(.cov-badge.has-coverage)),
body.cov-only-hide .cov-group:not(:has(.cov-badge.has-coverage)),
body.cov-only-hide .cov-subgroup:not(:has(.cov-badge.has-coverage)) { display: none; }

/* ---------- Report mode (?report=<source-slug-or-abbrev>): replaces the
   badge grid with a hierarchical, printable "everything this source covers"
   document -- see renderReportMode()/buildSourceReportHtml() in
   standards-coverage.js. Reuses .cov-panel's own <details> so Open all/
   Close all/Show CA* keep working unchanged; only these report-specific
   pieces (cards, %-tags, the empty-subsection note) are new. ---------- */
body.cov-report-mode aside#source-picker,
body.cov-report-mode #panel-resizer { display: none; }
body.cov-report-mode main#coverage-content { max-width: 900px; margin: 0 auto; }
.pct-tag { font-size: .78em; font-weight: normal; color: var(--muted); white-space: nowrap; }
.report-subsection { margin: .6rem 0 .6rem 1rem; }
.report-subsection summary { cursor: pointer; font-weight: 600; padding: .3rem 0; }
.report-empty { color: var(--muted); font-size: .88rem; margin: .2rem 0 .6rem 1rem; }
.print-report-btn { margin-left: auto; }
.topic {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: .9rem 1.15rem; margin: .8rem 0 .8rem 1rem;
}
.topic h3 { margin: 0 0 .3rem; font-size: 1rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; }
.topic .paraphrase { margin: .3rem 0; }
.topic .meta { font-size: .84rem; color: var(--muted); margin: .2rem 0 .5rem; }
.topic .note { font-size: .86rem; color: var(--muted); border-left: 3px solid var(--border); padding-left: .6rem; margin: .5rem 0; }
.anchor-link { color: var(--muted); text-decoration: none; margin-right: .35em; font-weight: normal; opacity: .5; }
.anchor-link:hover { opacity: 1; color: var(--accent); }
.code-badge {
  display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .78em; background: var(--bg); border: 1px solid var(--border);
  border-radius: 5px; padding: .05em .4em; color: var(--accent); white-space: nowrap;
}
@media print {
  body.cov-report-mode .panel-actions, body.cov-report-mode .page-header .home-link { display: none; }
  body.cov-report-mode main#coverage-content { height: auto; overflow: visible; max-width: none; }
  .topic { break-inside: avoid; }
  h1, h2, h3 { break-after: avoid; }
  a[href^="http"]:after { content: " (" attr(href) ")"; font-size: .8em; color: var(--muted); }
  a[href^="#"]:after { content: ""; }
}
main#coverage-content { flex: 1 1 auto; min-width: 0; height: 100vh; overflow-y: auto; padding: 1.5rem 2rem 6rem; }
h1 { margin-top: 0; }
.page-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.home-link { font-size: .85rem; color: var(--accent); text-decoration: underline; white-space: nowrap; }
.home-link:hover { color: var(--fg); }
.panel-resizer {
  flex: 0 0 7px; align-self: stretch; cursor: col-resize; position: relative;
}
.panel-resizer::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: var(--border);
}
.panel-resizer:hover::after, .panel-resizer.is-dragging::after { left: 2px; width: 3px; background: var(--accent); }
@media (max-width: 780px) {
  .layout { flex-direction: column; max-width: 100%; }
  aside#source-picker {
    position: static; height: auto; overflow: visible; flex: 1 1 auto;
    width: 100%; border-right: none; border-bottom: 1px solid var(--border);
  }
  main#coverage-content { height: auto; overflow: visible; padding: 1.25rem 1rem 4rem; }
  .panel-resizer { display: none; }
}
noscript p {
  border: 1px solid var(--border); background: var(--code-bg); border-radius: 8px;
  padding: .9rem 1.1rem; font-size: .92rem; color: var(--muted);
}
.cov-refs-nav { font-size: .85rem; color: var(--muted); margin: 1.2rem 0 0; line-height: 1.6; }
.cov-refs-nav a { color: var(--accent); }
.cov-recommendations { margin: 1.4rem 0 0; font-size: .85rem; }
.cov-recommendations ul { list-style: none; margin: 0; padding: 0; }
.cov-recommendations li { margin: .3rem 0; }
.reco-link {
  background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline;
  font: inherit; text-align: left; cursor: pointer;
}
.reco-link:hover { color: var(--fg); }
.reco-link:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.reco-disabled { color: var(--muted); }
.reco-cite { color: var(--muted); font-size: .92em; }
.reco-cite a { color: var(--accent); }
.panel-actions { margin: 0 0 1.2rem; font-size: .85rem; display: flex; gap: .4rem; flex-wrap: wrap; }
.view-toggle-btn {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
  padding: .3rem .7rem; color: var(--fg); font: inherit; cursor: pointer;
}
.view-toggle-btn:hover { border-color: var(--accent); }
.view-toggle-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view-toggle-btn.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
.cov-panel { margin: 2.5rem 0; }
.cov-panel h2 { font-size: 1.4rem; margin: 0 0 .3rem; display: inline; }
.cov-panel h2 a.panel-ref-link { color: inherit; text-decoration: underline; }
.cov-panel h2 a.panel-ref-link:hover { color: var(--accent); }
.cov-panel h2 a.panel-ref-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cov-panel h2 .panel-annotation { font-size: .75em; font-weight: normal; color: var(--muted); }
.cov-panel > details > summary {
  cursor: pointer; list-style: none; margin: 0 0 .3rem; position: relative;
}
.cov-panel > details > summary::-webkit-details-marker { display: none; }
/* Sits in the gutter (main's own left padding) rather than inline before the
   heading text, so the heading itself still lines up flush with everything
   below it (badges, group titles) instead of shifting right by the chevron's
   own width. */
.cov-panel > details > summary::before {
  content: "▶"; color: var(--muted); position: absolute; left: -1.7rem; top: -.05rem;
  font-size: 1.5rem; line-height: 1;
}
.cov-panel > details[open] > summary::before { content: "▼"; }
.cov-panel > details[open] > summary { margin-bottom: 1rem; }
.cov-group { margin: 1.3rem 0; }
.cov-group-title { font-size: .9rem; font-weight: 600; margin: 0 0 .5rem; }
.cov-subpanel-heading { font-size: 1.1rem; margin: 1.8rem 0 .3rem; padding-top: .8rem; border-top: 1px solid var(--border); }
.cov-subgroup { margin: .9rem 0; }
.cov-subgroup h4 { font-size: .88rem; color: var(--muted); font-weight: 600; margin: 0 0 .4rem; }
.cov-grid { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-start; }
.cov-badge { position: relative; display: inline-flex; flex-direction: column; align-items: stretch; }
.cov-badge-btn {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .78em;
  padding: .4em .6em; border-radius: 8px; border: 1px solid var(--border);
  background: var(--code-bg); color: var(--fg); cursor: pointer; white-space: nowrap;
  line-height: 1.2;
}
.cov-badge-btn:hover, .cov-badge-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cov-badge.has-coverage .cov-badge-btn { background: color-mix(in oklch, var(--muted) 22%, var(--bg)); }
/* A faint per-sub-type accent (Big Idea/Strand/Concept), only applied where a
   section has few enough groups to keep every hue distinct -- see groupHue()
   in standards-coverage.js. --group-hue is set inline per badge. */
.cov-badge[data-tinted] .cov-badge-btn {
  border-color: hsl(var(--group-hue) 55% 55% / .5);
  box-shadow: 0 0 0 1px hsl(var(--group-hue) 55% 55% / .22);
}
@media (prefers-color-scheme: dark) {
  .cov-badge[data-tinted] .cov-badge-btn {
    border-color: hsl(var(--group-hue) 55% 68% / .55);
    box-shadow: 0 0 0 1px hsl(var(--group-hue) 55% 68% / .28);
  }
}
:root[data-theme="dark"] .cov-badge[data-tinted] .cov-badge-btn {
  border-color: hsl(var(--group-hue) 55% 68% / .55);
  box-shadow: 0 0 0 1px hsl(var(--group-hue) 55% 68% / .28);
}
:root[data-theme="light"] .cov-badge[data-tinted] .cov-badge-btn {
  border-color: hsl(var(--group-hue) 55% 55% / .5);
  box-shadow: 0 0 0 1px hsl(var(--group-hue) 55% 55% / .22);
}
.cov-bars { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.cov-bar {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .6rem;
  font-weight: 600; line-height: 1.7; letter-spacing: .01em; white-space: nowrap;
  padding: 0 .4em; border-left: 3px solid; border-radius: 2px;
  background: var(--code-bg); color: var(--fg); text-align: left;
}
/* A "strong" match (the default -- most entries predate the strength field
   and are unmarked, same as "strong") gets a solid full-opacity bar. Weaker
   matches fade and switch to a non-solid border so a skim of the grid
   already shows "this is thinner" without opening the tooltip. */
.cov-bar[data-strength="partial"] { opacity: .72; border-left-style: dashed; }
.cov-bar[data-strength="related"] { opacity: .5; border-left-style: dotted; border-left-width: 6px; padding-left: .25em; }
.cov-tooltip {
  display: none; position: absolute; top: 100%; left: 0; z-index: 10; margin-top: .35rem;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: .7rem .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.18); width: max-content;
  max-width: 320px; font-size: .82rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.cov-badge.is-open .cov-tooltip { display: block; }
.cov-tooltip .tt-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--accent); }
.cov-tooltip .tt-paraphrase { margin: .4em 0; color: var(--fg); }
.cov-tooltip .tt-source { margin: .3em 0 0; color: var(--muted); }
.cov-tooltip .tt-source-note { font-style: italic; margin: 0 0 .3em; }
.tt-source-strength { color: var(--muted); font-weight: 400; }
.cov-anchor-block { opacity: .6; font-size: .92em; }
/* Cross-framework compare: a chevron per matched standard in the other
   framework, expanding in place (not a nested floating tooltip) to show that
   standard's own paraphrase side by side with this one. */
.tt-crosswalk { margin: .5em 0; }
.tt-xref-toggle {
  display: block; width: 100%; text-align: left; background: none; border: none; padding: .15em 0;
  color: var(--muted); font: inherit; font-size: .92em; cursor: pointer;
}
.tt-xref-toggle:hover, .tt-xref-toggle:focus-visible { color: var(--fg); }
.tt-xref-chevron { display: inline-block; width: 1em; }
.tt-xref-strength { color: var(--muted); }
.tt-xref-detail {
  margin: .2em 0 .5em 1.1em; padding: .3em .6em; border-left: 2px solid var(--border); font-size: .95em;
}
.tt-xref-detail .tt-xref-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--accent); }
.tt-xref-detail .tt-xref-text { margin: .25em 0; color: var(--fg); }
.tt-xref-detail .tt-xref-note { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="layout">
<aside id="source-picker">
<details id="source-details">
<summary>Sources</summary>
<div class="source-picker-actions">
<button type="button" id="source-select-all">All</button><span class="sep">&middot;</span><button type="button" id="source-select-none">None</button>
</div>
<div id="source-list">Loading&hellip;</div>
</details>
<div class="cov-refs-nav">
<a href="alignment/">Coverage detail</a>
</div>
<div class="cov-recommendations">
<h2>Recommendations</h2>
<ul>
<li><a class="reco-link" href="?sources=cmu_cs0&amp;view=ca-ms" data-sources="cmu_cs0" data-view="ca-ms">MS1</a> <span class="reco-cite">(<a href="https://academy.cs.cmu.edu/course-info#:~:text=EXPLORE%20THE%204%20UNITS" target="_blank" rel="noopener">CMU CS0</a>)</span></li>
<li><a class="reco-link" href="?sources=cmu_cs1&amp;view=ca-cs" data-sources="cmu_cs1" data-view="ca-cs">MS2</a> <span class="reco-cite">(<a href="https://academy.cs.cmu.edu/course-info" target="_blank" rel="noopener">CMU CS1</a>)</span></li>
<li><a class="reco-link" href="?sources=cmu_cs1,little_brother&amp;view=ca-hs-ict" data-sources="cmu_cs1,little_brother" data-view="ca-hs-ict">HS Exploring</a> <span class="reco-cite">(<a href="https://academy.cs.cmu.edu/course-info" target="_blank" rel="noopener">CMU CS1</a>, <a href="https://porttack.com/2026/06/14/little-brother.html" target="_blank" rel="noopener">Little Brother</a>)</span></li>
<li><a class="reco-link" href="?sources=working_in_python,little_brother,cs50ap,cs50p&amp;view=ca-hs" data-sources="working_in_python,little_brother,cs50ap,cs50p" data-view="ca-hs">HS AP CSP</a></li>
<li><span class="reco-disabled">HS Robotics (not aligned here yet)</span></li>
</ul>
</div>
</aside>
<div id="panel-resizer" class="panel-resizer"></div>
<main id="coverage-content">
<div class="page-header">
<h1>Standards Coverage</h1>
<a href="/" class="home-link">&larr; Home</a>
</div>
<div id="only-banner" hidden></div>
<div class="panel-actions" role="group" aria-label="Which standards panels to show">
<button type="button" class="view-toggle-btn" id="view-show-open-all" data-view="open-all" aria-pressed="false">Open all</button>
<button type="button" class="view-toggle-btn" id="view-show-close-all" data-view="close-all" aria-pressed="false">Close all</button>
<button type="button" class="view-toggle-btn" id="view-show-ca" data-view="ca" aria-pressed="false">Show CA</button>
<button type="button" class="view-toggle-btn" id="view-show-ca-hs" data-view="ca-hs" aria-pressed="false">Show CA HS</button>
<button type="button" class="view-toggle-btn" id="view-show-ca-ms" data-view="ca-ms" aria-pressed="false">Show CA MS</button>
</div>
<noscript><p>This page needs JavaScript to render the coverage grid.</p></noscript>
<div id="panels"></div>
</main>
</div>
<script src="/assets/js/standards-coverage.js"></script>
</body>
