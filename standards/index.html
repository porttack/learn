<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Standards Coverage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #ffffff; --fg: #1b1f23; --muted: #57606a; --border: #d0d7de;
  --accent: #0969da; --code-bg: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
    --accent: #4493f8; --code-bg: #161b22; }
}
:root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
  --accent: #4493f8; --code-bg: #161b22; }
:root[data-theme="light"] { --bg: #ffffff; --fg: #1b1f23; --muted: #57606a; --border: #d0d7de;
  --accent: #0969da; --code-bg: #f6f8fa; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.layout { display: flex; max-width: 1300px; margin: 0 auto; align-items: flex-start; }
aside#source-picker {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; flex: 0 0 260px;
  padding: 1rem; border-right: 1px solid var(--border); font-size: 0.85rem;
}
aside#source-picker h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 .6rem; }
.source-row { display: flex; align-items: center; gap: .55rem; padding: .3rem 0; cursor: pointer; }
.source-row input { flex: 0 0 auto; }
.source-row .swatch { width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto; border: 1px solid var(--border); }
.source-row .source-title { flex: 1 1 auto; }
main#coverage-content { flex: 1 1 auto; min-width: 0; height: 100vh; overflow-y: auto; padding: 1.5rem 2rem 6rem; }
h1 { margin-top: 0; }
footer { color: var(--muted); font-size: .8rem; margin-top: 3rem; border-top: 1px solid var(--border); padding-top: 1rem; }
noscript p {
  border: 1px solid var(--border); background: var(--code-bg); border-radius: 8px;
  padding: .9rem 1.1rem; font-size: .92rem; color: var(--muted);
}
.cov-refs-nav { font-size: .85rem; color: var(--muted); margin: 1.2rem 0 0; line-height: 1.6; }
.cov-refs-nav a { color: var(--accent); }
.cov-panel { margin: 2.5rem 0; }
.cov-panel > h2 { font-size: 1.4rem; margin: 0 0 .3rem; }
.cov-group { margin: 1.3rem 0; }
.cov-group-title { font-size: .9rem; font-weight: 600; margin: 0 0 .5rem; }
.cov-subpanel-heading { font-size: 1.1rem; margin: 1.8rem 0 .3rem; padding-top: .8rem; border-top: 1px solid var(--border); }
.cov-subgroup { margin: .9rem 0; }
.cov-subgroup h4 { font-size: .88rem; color: var(--muted); font-weight: 600; margin: 0 0 .4rem; }
.cov-grid { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-start; }
.cov-badge { position: relative; display: inline-flex; flex-direction: column; align-items: stretch; }
.cov-badge-btn {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .78em;
  padding: .4em .6em; border-radius: 8px; border: 1px solid var(--border);
  background: var(--code-bg); color: var(--fg); cursor: pointer; white-space: nowrap;
  line-height: 1.2;
}
.cov-badge-btn:hover, .cov-badge-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cov-badge.has-coverage .cov-badge-btn { background: color-mix(in oklch, var(--muted) 22%, var(--bg)); }
/* A faint per-sub-type accent (Big Idea/Strand/Concept), only applied where a
   section has few enough groups to keep every hue distinct -- see groupHue()
   in standards-coverage.js. --group-hue is set inline per badge. */
.cov-badge[data-tinted] .cov-badge-btn {
  border-color: hsl(var(--group-hue) 55% 55% / .5);
  box-shadow: 0 0 0 1px hsl(var(--group-hue) 55% 55% / .22);
}
@media (prefers-color-scheme: dark) {
  .cov-badge[data-tinted] .cov-badge-btn {
    border-color: hsl(var(--group-hue) 55% 68% / .55);
    box-shadow: 0 0 0 1px hsl(var(--group-hue) 55% 68% / .28);
  }
}
:root[data-theme="dark"] .cov-badge[data-tinted] .cov-badge-btn {
  border-color: hsl(var(--group-hue) 55% 68% / .55);
  box-shadow: 0 0 0 1px hsl(var(--group-hue) 55% 68% / .28);
}
:root[data-theme="light"] .cov-badge[data-tinted] .cov-badge-btn {
  border-color: hsl(var(--group-hue) 55% 55% / .5);
  box-shadow: 0 0 0 1px hsl(var(--group-hue) 55% 55% / .22);
}
.cov-bars { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.cov-bar {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .6rem;
  font-weight: 600; line-height: 1.7; letter-spacing: .01em; white-space: nowrap;
  padding: 0 .4em; border-left: 3px solid; border-radius: 2px;
  background: var(--code-bg); color: var(--fg); text-align: left;
}
.cov-tooltip {
  display: none; position: absolute; top: 100%; left: 0; z-index: 10; margin-top: .35rem;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: .7rem .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.18); width: max-content;
  max-width: 280px; font-size: .82rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.cov-badge.is-open .cov-tooltip { display: block; }
.cov-tooltip .tt-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--accent); }
.cov-tooltip .tt-paraphrase { margin: .4em 0; color: var(--fg); }
.cov-tooltip .tt-source { margin: .3em 0 0; color: var(--muted); }
.cov-anchor-block { opacity: .6; font-size: .92em; }
</style>
</head>
<body>
<div class="layout">
<aside id="source-picker">
<h2>Sources</h2>
<div id="source-list">Loading&hellip;</div>
<div class="cov-refs-nav">

<a href="ca-ict-anchor-standards-reference.html">CA ICT</a> &middot;
<a href="alignment/">coverage detail</a>
</div>
</aside>
<main id="coverage-content">
<h1>Standards Coverage</h1>
<noscript><p>This page needs JavaScript to render the coverage grid.</p></noscript>
<div id="panels"></div>
<footer>Rendered client-side from <code>standards/data/</code>. Not an official framework document.</footer>
</main>
</div>
<script src="/assets/js/standards-coverage.js"></script>
</body>
</html>
